schema_version: "1.0"
source_package: source:triton-ascend.a60006ac63f3

rules:
  # Baseline classification for every tracked repository entry. Later rules
  # override this when a reviewed section is eligible for Concept extraction.
  - include: "*"
    mode: source_only
  - include: docs/**/*.md
    mode: indexed
  - include: docs/en/migration_guide/*.md
    mode: direct
    kinds: [reference, method]
  - include: docs/en/debug_guide/*.md
    mode: direct
    kinds: [diagnostic]
  - include: docs/en/programming_guide/*.md
    mode: direct
    kinds: [method, diagnostic]
  - include: docs/en/debug_guide/precision.md
    mode: direct
    kinds: [reference, diagnostic]
  - include: docs/zh/triton_api/Creation_Ops/cast.md
    mode: direct
    kinds: [reference, method, diagnostic]
  - include: docs/zh/triton_api/Linear_Algebra_Ops/dot.md
    mode: direct
    kinds: [reference, method, diagnostic]

entries:
  - source_path: docs/en/debug_guide/precision.md
    heading: Integer Types
    mode: direct
    proposed_kind: reference
    proposed_id: kg:reference:triton-ascend-integer-exact-comparison
    claim_key: reference.triton_ascend.integer_exact_comparison
    title: Validate Triton Ascend integer outputs with exact equality
    summary: Compare int8 and other integer outputs with exact element equality rather than floating-point tolerances, after moving both results to a comparable device.
    domains: [correctness, numerics, validation]
    scope:
      target:
        level: backend
        backend: ascend
        software:
          language: triton
          compiler: triton-ascend
      operator:
        dtypes: [int8, int16, int32, int64]
      numerics:
        exact: true
    retrieval:
      phases: [post_evaluation, post_error]
      tasks: [constraint_check, diagnosis]
      symptoms: [integer_mismatch, precision_failure]
      techniques: [exact_comparison, torch_equal]
      keywords: [int8, integer, exact equality, torch.equal, precision]

