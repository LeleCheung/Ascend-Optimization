<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KernelGen Lab</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f7fb; --panel: #ffffff; --panel-2: #f0f3f8; --border: #d8dee9;
    --text: #1f2937; --muted: #667085; --accent: #315efb; --accent-2: #2347c5;
    --ok: #16803c; --warn: #b36b00; --err: #d92d20; --run: #2563eb;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 14px 22px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: .3px; }
  header .version {
    color: var(--muted); font: 12px/1 var(--mono); padding: 4px 7px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--panel-2);
  }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  header .dot.live { background: var(--ok); }
  header .spacer { flex: 1; }
  header input {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 10px; font-family: var(--mono); font-size: 12px; width: 220px;
  }
  header button { padding: 6px 10px; font-size: 12px; white-space: nowrap; }
  .auth-controls { display: flex; align-items: center; gap: 8px; }
  .auth-controls[hidden] { display: none; }
  .layout {
    --left-width: 340px;
    display: grid; grid-template-columns: var(--left-width) 6px minmax(0, 1fr);
    gap: 0; height: calc(100vh - 55px);
  }
  .col { overflow-y: auto; padding: 18px; min-width: 0; }
  .splitter {
    position: relative; cursor: col-resize; background: var(--border);
    touch-action: none; outline: none;
  }
  .splitter::after {
    content: ""; position: absolute; inset: 0 -3px;
  }
  .splitter:hover, .splitter.dragging, .splitter:focus-visible {
    background: var(--accent);
  }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 12px; }
  form { display: flex; flex-direction: column; gap: 10px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  input[type=text], input[type=number], select {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 7px 9px; font-size: 13px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > label { display: block; }
  .definition-combobox { position: relative; }
  .definition-combobox input { width: 100%; }
  .definition-listbox {
    position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0;
    max-height: 260px; overflow-y: auto; padding: 4px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 7px;
    box-shadow: 0 10px 28px rgba(15,23,42,.14);
  }
  .definition-listbox[hidden] { display: none; }
  .definition-option {
    padding: 7px 9px; border-radius: 5px; color: var(--text); cursor: pointer;
    font: 13px/1.35 var(--mono); overflow-wrap: anywhere;
  }
  .definition-option:hover, .definition-option.active {
    background: var(--accent); color: #fff;
  }
  .definition-hint { min-height: 18px; color: var(--muted); font-size: 11px; }
  .definition-hint.error { color: var(--err); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .instance-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: end; }
  .instance-row label { min-width: 0; }
  .instance-row button { height: 34px; padding: 7px 12px; }
  dialog {
    width: min(420px, calc(100vw - 32px)); color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; padding: 18px;
  }
  dialog::backdrop { background: rgba(15,23,42,.32); }
  dialog h3 { margin: 0 0 14px; font-size: 15px; }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  dialog .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  dialog .check { flex-direction: row; align-items: flex-start; gap: 8px; color: var(--text); }
  dialog .check input { margin: 2px 0 0; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: 9px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: var(--accent-2); }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); font-weight: 500; }
  button.ghost:hover { background: var(--panel-2); }
  button.danger { background: transparent; border: 1px solid var(--err); color: var(--err); padding: 4px 10px; font-size: 12px; }
  button.danger:hover { background: rgba(248,81,73,.12); }
  .msg { font-size: 12px; padding: 8px 10px; border-radius: 6px; display: none; }
  .msg.show { display: block; }
  .msg.ok { background: rgba(63,185,80,.12); color: var(--ok); }
  .msg.err { background: rgba(248,81,73,.12); color: var(--err); }
  .runlist { display: flex; flex-direction: column; gap: 8px; }
  .run-entry { display: flex; flex-direction: column; min-width: 0; }
  .run {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; cursor: pointer; transition: border-color .12s;
  }
  .run:hover { border-color: var(--accent); }
  .run.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .run-entry.expanded .run { border-radius: 8px 8px 0 0; }
  .run-entry.expanded .detail {
    min-width: 0; padding: 14px; background: var(--panel);
    border: 1px solid var(--accent); border-top: 0; border-radius: 0 0 8px 8px;
  }
  .run .main { min-width: 0; }
  .run .top { display: flex; align-items: center; gap: 8px; }
  .run .def { font-weight: 600; }
  .run .ws { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 4px; word-break: break-all; }
  .run .metrics { display: grid; grid-template-columns: 90px minmax(160px, 220px) 76px; gap: 20px; }
  .run .metric { min-width: 0; }
  .run .metric-label {
    display: block; color: var(--muted); font-size: 10px; font-weight: 600;
    letter-spacing: .5px; text-transform: uppercase; margin-bottom: 3px;
  }
  .run .metric-value { display: block; font: 12px/1.35 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .run .metric.best-metric .metric-value { color: var(--ok); font-size: 16px; font-weight: 700; }
  .pools { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .pool {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 12px; font-size: 12px;
  }
  .pool .head { display: flex; align-items: center; gap: 10px; }
  .pool .url { font-family: var(--mono); color: var(--muted); flex: 1; word-break: break-all; }
  .pool .count { font-weight: 600; color: var(--text); white-space: nowrap; }
  .pool .count.full { color: var(--warn); }
  .pool .bar { height: 4px; background: var(--panel-2); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .pool .bar .fill { height: 100%; background: var(--accent); transition: width .2s; }
  .pool .bar .fill.full { background: var(--warn); }
  .badge {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .4px;
  }
  .b-RUNNING, .b-CODING, .b-EVALUATING { background: rgba(88,166,255,.15); color: var(--run); }
  .b-QUEUED, .b-SUBMITTED, .b-PENDING { background: rgba(210,153,34,.15); color: var(--warn); }
  .b-SUCCEEDED, .b-GENERATED { background: rgba(63,185,80,.15); color: var(--ok); }
  .b-FAILED, .b-INFRASTRUCTURE_ERROR, .b-INTERRUPTED, .b-SUBMISSION_FAILED { background: rgba(248,81,73,.15); color: var(--err); }
  .b-CANCELLED, .b-CANCEL_REQUESTED { background: rgba(154,163,178,.15); color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
  /* Detail panel structured sections */
  .section {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .section .title {
    font-size: 11px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  .hero .def { font-size: 20px; font-weight: 700; margin-bottom: 2px; word-break: break-all; }
  .hero .meta { color: var(--muted); font-size: 12px; }
  .error-box {
    background: rgba(248,81,73,.08); border: 1px solid rgba(248,81,73,.35);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 10px;
  }
  .error-box .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-weight: 600; color: var(--err); }
  .error-box .error-message {
    display: block; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word;
    background: rgba(217,45,32,.06); padding: 8px 10px; border-radius: 4px;
  }
  .activity-feed {
    max-height: 280px; overflow-y: auto; border: 1px solid var(--border);
    border-radius: 6px; background: var(--panel);
  }
  .activity-empty { color: var(--muted); font-size: 12px; padding: 12px; }
  .activity-row { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .activity-row:last-child { border-bottom: 0; }
  .activity-row.warning { background: rgba(210,153,34,.06); }
  .activity-row.error { background: rgba(248,81,73,.08); }
  .activity-row .activity-meta {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    color: var(--muted); font: 11px/1.4 var(--mono);
  }
  .activity-row .activity-level { font-weight: 700; }
  .activity-row.warning .activity-level { color: var(--warn); }
  .activity-row.error .activity-level { color: var(--err); }
  .activity-row .activity-type { color: var(--text); }
  .activity-row .activity-message {
    margin-top: 4px; color: var(--text); font-size: 12px;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .progress .row { display: flex; align-items: center; gap: 12px; }
  .progress .rd { font-family: var(--mono); font-weight: 600; white-space: nowrap; }
  .progress .stage { color: var(--muted); font-size: 12px; }
  .progress .bar { height: 6px; background: var(--panel); border-radius: 3px; flex: 1; overflow: hidden; }
  .progress .bar .fill { height: 100%; background: var(--accent); transition: width .3s; }
  .best {
    display: flex; align-items: baseline; gap: 10px; margin-top: 10px;
    padding: 10px 12px; background: rgba(63,185,80,.08); border: 1px solid rgba(63,185,80,.3);
    border-radius: 6px;
  }
  .best .num { font-size: 22px; font-weight: 700; color: var(--ok); font-family: var(--mono); }
  .best .lbl { color: var(--muted); font-size: 12px; }
  .counts { display: flex; gap: 14px; flex-wrap: wrap; }
  .counts .c { font-size: 12px; }
  .counts .c b { font-size: 15px; font-family: var(--mono); }
  .counts .ok b { color: var(--ok); }
  .counts .err b { color: var(--err); }
  .counts .warn b { color: var(--warn); }
  .counts .mut b { color: var(--muted); }
  .meta-kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; font-size: 12px; }
  .meta-kv .k { color: var(--muted); }
  .meta-kv .v { font-family: var(--mono); word-break: break-all; }
  .history-series + .history-series { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .history-series-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .history-series-head .scope { font: 600 12px/1.4 var(--mono); overflow-wrap: anywhere; }
  .history-series-head .summary { color: var(--muted); font-size: 11px; }
  .speedup-chart {
    width: 100%; margin-bottom: 10px; overflow: hidden;
    border: 1px solid var(--border); border-radius: 6px; background: var(--panel);
  }
  .speedup-chart svg { display: block; width: 100%; height: clamp(150px, 28vw, 220px); }
  .speedup-grid { stroke: var(--border); stroke-width: 1; }
  .speedup-baseline { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 5 4; }
  .speedup-line { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .speedup-point { fill: var(--panel); stroke: var(--accent); stroke-width: 2; }
  .speedup-point.best-point { fill: var(--ok); stroke: var(--panel); stroke-width: 3; }
  .speedup-best-halo { fill: rgba(22,128,60,.14); stroke: var(--ok); stroke-width: 1; }
  .speedup-label { fill: var(--muted); font: 11px var(--mono); }
  .speedup-best-label { fill: var(--ok); font: 700 12px var(--mono); }
  .speedup-empty { color: var(--muted); font-size: 12px; padding: 18px; text-align: center; }
  .rounds-wrap { max-width: 100%; overflow-x: auto; }
  .rounds-table { width: 100%; min-width: 430px; font-size: 12px; border-collapse: collapse; }
  .rounds-table th, .rounds-table td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); }
  .rounds-table th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; }
  .rounds-table td.num { font-family: var(--mono); text-align: right; }
  .rounds-table tr.best-row td { background: rgba(22,128,60,.12); font-weight: 600; }
  .rounds-table tr.best-row td:first-child { box-shadow: inset 3px 0 var(--ok); }
  .rounds-table tr.hack-row td.st { color: var(--warn); }
  .best-tag { color: var(--ok); font: 700 10px/1 var(--mono); white-space: nowrap; }
  details.raw summary {
    cursor: pointer; color: var(--muted); font-size: 12px; padding: 4px 0;
    user-select: none; list-style: none;
  }
  details.raw summary::before { content: "▶ "; font-size: 10px; }
  details.raw[open] summary::before { content: "▼ "; }
  details.raw pre { margin-top: 4px; }
  .child-list { display: flex; flex-direction: column; gap: 4px; }
  .child-row {
    display: flex; align-items: center; gap: 8px; font-size: 12px;
    padding: 4px 6px; border-radius: 4px;
  }
  .child-row:hover { background: rgba(15,23,42,.04); }
  .child-row .def { font-weight: 500; }
  .child-row .stage { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .detail .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; margin-bottom: 16px; }
  .detail .kv .k { color: var(--muted); font-size: 12px; }
  .detail .kv .v { font-family: var(--mono); font-size: 12px; word-break: break-all; }
  .detail pre {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px; font-family: var(--mono); font-size: 12px; overflow-x: auto; max-height: 420px;
  }
  .detail .head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .detail .head h2 { margin: 0; }
  @media (max-width: 760px) {
    header { flex-wrap: wrap; padding-inline: 16px; }
    header .auth-controls { width: 100%; }
    header .auth-controls input { flex: 1; min-width: 0; width: auto; }
    .layout { display: block; height: auto; }
    .splitter { display: none; }
    .col { overflow: visible; }
    .col.left { border-bottom: 1px solid var(--border); }
    .run-entry.expanded .detail { padding: 12px; }
    .detail .head { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<header>
  <div class="dot" id="live"></div>
  <h1>KernelGen Lab</h1>
  <span class="version" id="kgVersion"></span>
  <span class="spacer"></span>
  <div class="auth-controls" id="authControls">
    <input id="token" type="text" placeholder="API token (if required)" />
    <button class="ghost" id="copyDemoLink" type="button">Copy demo link</button>
  </div>
</header>

<div class="layout" id="layout">
  <div class="col left">
    <h2>Submit run</h2>
    <form id="submitForm">
      <label>Machine
        <select id="machine"></select>
      </label>
      <div class="instance-row">
        <label>KGS instance
          <select id="device"></select>
        </label>
        <button class="ghost" id="addInstanceBtn" type="button">Add</button>
        <button class="danger" id="stopInstanceBtn" type="button" hidden>Stop</button>
      </div>
      <div class="msg" id="instanceMsg"></div>
      <div class="field">
        <label for="definition">Definition</label>
        <div class="definition-combobox" id="definitionCombobox">
          <input
            type="text"
            id="definition"
            placeholder="e.g. softmax"
            autocomplete="off"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="definitionListbox"
            aria-describedby="definitionHint"
            required
          />
          <div class="definition-listbox" id="definitionListbox" role="listbox" hidden></div>
        </div>
        <div class="definition-hint" id="definitionHint" role="status" aria-live="polite">Loading definitions…</div>
      </div>
      <div class="row2">
        <label>Mode
          <select id="mode">
            <option value="simple_opt">simple_opt</option>
            <option value="kernelgen">kernelgen</option>
          </select>
        </label>
        <label>max-round
          <input type="number" id="max_round" min="1" value="15" />
        </label>
      </div>
      <input type="hidden" id="target_hardware" value="Ascend910B" />
      <input type="hidden" id="eval_server" value="http://localhost:8000" />
      <label id="nParallelLabel">n-parallel (kernelgen)
        <input type="number" id="n_parallel" min="1" value="3" />
      </label>
      <label>Workspace (optional)
        <input type="text" id="workspace" placeholder="auto-generated if empty" />
      </label>
      <button id="submitBtn" type="submit">Submit</button>
      <div class="msg" id="submitMsg"></div>
    </form>
  </div>

  <div class="splitter" id="splitter" role="separator" aria-label="Resize submit panel" aria-orientation="vertical" tabindex="0"></div>

  <div class="col right">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
      <h2 style="margin:0;">Runs</h2>
      <span class="spacer" style="flex:1"></span>
      <button class="ghost" id="refreshBtn">Refresh</button>
    </div>
    <div class="runlist" id="runlist"><div class="empty">Loading…</div></div>
    <div id="detailParking" hidden>
      <div class="detail" id="detail" hidden></div>
    </div>
  </div>
</div>

<dialog id="addInstanceDialog">
  <h3>Add KGS instance</h3>
  <form id="addInstanceForm" method="dialog">
    <label>Machine
      <input type="text" id="addMachine" readonly />
    </label>
    <label>KGS version
      <select id="kgsVersion"></select>
    </label>
    <label class="check">
      <input type="checkbox" id="installFlagGems" checked />
      <span>Install compatible FlagGems</span>
    </label>
    <div class="hint">Uses the FlagGems version declared by the selected KGS. Ports are allocated automatically.</div>
    <div class="msg" id="addInstanceMsg"></div>
    <div class="actions">
      <button class="ghost" id="cancelAddInstance" type="button">Cancel</button>
      <button id="confirmAddInstance" type="submit">Start</button>
    </div>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
let selectedWs = null;
let pollTimer = null;
let instanceTimer = null;
let runsLoaded = false;
let detailRefreshing = false;
let detailRefreshQueued = false;
const ACTIVITY_CLIENT_LIMIT = 100;
let activityState = {
  workspace: null,
  events: [],
  nextSequence: null,
  hasMore: false,
  loaded: false,
};
let activityViewState = {
  workspace: null,
  top: 0,
  pinned: true,
  anchorSequence: null,
  anchorOffset: 0,
};

function token() { return $("token").value.trim(); }

function headers(extra) {
  const h = Object.assign({ "Content-Type": "application/json" }, extra || {});
  const t = token();
  if (t) h["X-KG-Token"] = t;
  return h;
}

function saveToken(value) {
  try { localStorage.setItem("kg_token", value); } catch (e) {}
}

function restoreToken() {
  let value = "";
  try { value = localStorage.getItem("kg_token") || ""; } catch (e) {}
  const params = new URLSearchParams(window.location.hash.slice(1));
  if (params.has("token")) {
    const linked = (params.get("token") || "").trim();
    if (linked) {
      value = linked;
      saveToken(linked);
    }
    try {
      history.replaceState(null, "", window.location.pathname + window.location.search);
    } catch (e) {}
  }
  $("token").value = value;
}

async function copyText(value) {
  if (navigator.clipboard && window.isSecureContext) {
    await navigator.clipboard.writeText(value);
    return;
  }
  const area = document.createElement("textarea");
  area.value = value;
  area.setAttribute("readonly", "");
  area.style.position = "fixed";
  area.style.opacity = "0";
  document.body.appendChild(area);
  area.select();
  const copied = document.execCommand("copy");
  area.remove();
  if (!copied) throw new Error("copy failed");
}

function setCopyButtonLabel(label) {
  const button = $("copyDemoLink");
  button.textContent = label;
  window.setTimeout(() => { button.textContent = "Copy demo link"; }, 1800);
}

restoreToken();
$("token").addEventListener("change", () => {
  saveToken(token());
  loadServiceConfig();
});
$("copyDemoLink").addEventListener("click", async () => {
  const value = token();
  if (!value) {
    setCopyButtonLabel("Enter token first");
    $("token").focus();
    return;
  }
  const url = new URL(window.location.href);
  url.hash = new URLSearchParams({ token: value }).toString();
  try {
    await copyText(url.toString());
    setCopyButtonLabel("Copied");
  } catch (e) {
    setCopyButtonLabel("Copy failed");
  }
});

const layout = $("layout");
const splitter = $("splitter");
let panelWidth = 340;

function setPanelWidth(width, persist = false) {
  const maximum = Math.max(260, layout.clientWidth - 320);
  panelWidth = Math.max(260, Math.min(maximum, Math.round(width)));
  layout.style.setProperty("--left-width", `${panelWidth}px`);
  splitter.setAttribute("aria-valuenow", String(panelWidth));
  if (persist) {
    try { localStorage.setItem("kg_left_width", String(panelWidth)); } catch (e) {}
  }
}

try {
  const savedWidth = Number(localStorage.getItem("kg_left_width"));
  if (Number.isFinite(savedWidth) && savedWidth > 0) panelWidth = savedWidth;
} catch (e) {}
setPanelWidth(panelWidth);

let resizeStart = null;
splitter.addEventListener("pointerdown", (event) => {
  resizeStart = { x: event.clientX, width: panelWidth };
  splitter.classList.add("dragging");
  splitter.setPointerCapture(event.pointerId);
});
splitter.addEventListener("pointermove", (event) => {
  if (!resizeStart) return;
  setPanelWidth(resizeStart.width + event.clientX - resizeStart.x);
});
function finishResize() {
  if (!resizeStart) return;
  resizeStart = null;
  splitter.classList.remove("dragging");
  setPanelWidth(panelWidth, true);
}
splitter.addEventListener("pointerup", finishResize);
splitter.addEventListener("pointercancel", finishResize);
splitter.addEventListener("keydown", (event) => {
  if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
  event.preventDefault();
  setPanelWidth(panelWidth + (event.key === "ArrowLeft" ? -20 : 20), true);
});
window.addEventListener("resize", () => setPanelWidth(panelWidth));

async function api(path, opts) {
  const options = Object.assign({ headers: headers() }, opts || {});
  let res;
  try {
    res = await fetch(path, options);
  } catch (error) {
    const method = String(options.method || "GET").toUpperCase();
    if (method !== "GET") throw error;
    await new Promise((resolve) => setTimeout(resolve, 300));
    res = await fetch(path, options);
  }
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    throw new Error(`${res.status}: ${detail}`);
  }
  return res.json();
}

async function loadServiceConfig() {
  try {
    const data = await api("/api/config");
    $("kgVersion").textContent = data.version || "";
    $("authControls").hidden = data.requires_auth === false;
  } catch (e) {
    // Keep auth controls available when the configuration request itself needs a token.
    $("authControls").hidden = false;
  }
}

function badge(state) {
  return `<span class="badge b-${state}">${state}</span>`;
}

function shortWs(ws) {
  const parts = ws.split("/");
  return parts.slice(-2).join("/");
}

function hasTextSelectionWithin(root) {
  const selection = typeof window.getSelection === "function" ? window.getSelection() : null;
  if (!root || !selection || selection.isCollapsed || !selection.rangeCount) return false;
  return root.contains(selection.anchorNode) || root.contains(selection.focusNode);
}

function detailSelectionActive(workspace) {
  const detail = $("detail");
  return detail.dataset.workspace === workspace && hasTextSelectionWithin(detail);
}

function setTextIfChanged(node, value) {
  if (node.textContent !== value) node.textContent = value;
}

function captureActivityScroll() {
  const feed = $("activityFeed");
  const workspace = activityState.workspace;
  if (!feed || !workspace || feed.clientHeight === 0) return;
  const feedTop = feed.getBoundingClientRect().top;
  const anchor = Array.from(feed.querySelectorAll(".activity-row"))
    .find((row) => row.getBoundingClientRect().bottom > feedTop);
  activityViewState = {
    workspace,
    top: feed.scrollTop,
    pinned: feed.scrollHeight - feed.clientHeight - feed.scrollTop < 24,
    anchorSequence: anchor ? anchor.dataset.sequence : null,
    anchorOffset: anchor ? anchor.getBoundingClientRect().top - feedTop : 0,
  };
}

function restoreActivityScroll() {
  const feed = $("activityFeed");
  if (!feed || feed.clientHeight === 0) return;
  feed.removeEventListener("scroll", captureActivityScroll);
  const saved = activityViewState.workspace === activityState.workspace
    ? activityViewState
    : null;
  if (!saved || saved.pinned) {
    feed.scrollTop = feed.scrollHeight;
  } else if (saved.anchorSequence) {
    const anchor = feed.querySelector(`[data-sequence="${saved.anchorSequence}"]`);
    if (anchor) {
      const currentOffset = anchor.getBoundingClientRect().top
        - feed.getBoundingClientRect().top;
      feed.scrollTop += currentOffset - saved.anchorOffset;
    } else {
      feed.scrollTop = saved.top;
    }
  } else {
    feed.scrollTop = saved.top;
  }
  feed.addEventListener("scroll", captureActivityScroll, { passive: true });
  captureActivityScroll();
}

function resetActivityView(workspace = null) {
  activityViewState = {
    workspace,
    top: 0,
    pinned: true,
    anchorSequence: null,
    anchorOffset: 0,
  };
}

function parkDetail() {
  captureActivityScroll();
  const activityFeed = $("activityFeed");
  if (activityFeed) activityFeed.removeEventListener("scroll", captureActivityScroll);
  const detail = $("detail");
  const entry = detail.closest(".run-entry");
  if (entry) entry.classList.remove("expanded");
  $("detailParking").appendChild(detail);
  detail.hidden = true;
}

function mountDetail() {
  if (!selectedWs) {
    parkDetail();
    return false;
  }
  const entry = Array.from($("runlist").querySelectorAll(".run-entry"))
    .find((item) => decodeURIComponent(item.dataset.ws) === selectedWs);
  if (!entry) {
    parkDetail();
    return false;
  }
  const detail = $("detail");
  const previousEntry = detail.closest(".run-entry");
  if (previousEntry && previousEntry !== entry) previousEntry.classList.remove("expanded");
  entry.classList.add("expanded");
  entry.appendChild(detail);
  detail.hidden = false;
  restoreActivityScroll();
  return true;
}

function clearRunSelection() {
  selectedWs = null;
  document.querySelectorAll(".run").forEach((el) => {
    el.classList.remove("sel");
    el.setAttribute("aria-expanded", "false");
  });
  activityState = {
    workspace: null,
    events: [],
    nextSequence: null,
    hasMore: false,
    loaded: false,
  };
  resetActivityView();
  const detail = $("detail");
  detail.innerHTML = "";
  delete detail.dataset.workspace;
  parkDetail();
}

function runProgressDetails(run) {
  const root = run.progress || {};
  const direct = root.progress || root;
  if (direct.best_geo_mean != null || direct.completed_rounds != null) return direct;
  const optimizeScope = root.scopes && root.scopes["stages/optimize"];
  const scoped = optimizeScope && optimizeScope.progress;
  if (scoped) return scoped;
  return Object.values(root.scopes || {})
    .map((item) => item && item.progress)
    .find((item) => item && (item.best_geo_mean != null || item.completed_rounds != null))
    || direct;
}

function runInstanceLabel(run) {
  const instance = (fleetSnapshot.instances || [])
    .find((item) => item.eval_server === run.eval_server);
  const hardware = run.target_hardware || (instance && instance.target_hardware);
  if (!instance) return hardware || "—";
  return `${instance.instance_id}${hardware ? ` · ${hardware}` : ""}`;
}

function updateRunEntry(entry, run) {
  const workspace = run.workspace;
  const encoded = encodeURIComponent(workspace);
  const row = entry.querySelector(".run");
  const selected = workspace === selectedWs;
  const state = String(run.state || "UNKNOWN");
  const stateClass = state.replace(/[^A-Z0-9_]/g, "");
  const kind = run.kind === "batch" ? `batch (${run.total_tasks})` : run.definition;
  const progress = runProgressDetails(run);
  const best = progress.best_geo_mean;
  const rounds = progress.completed_rounds;
  const instance = runInstanceLabel(run);

  entry.dataset.ws = encoded;
  row.dataset.ws = encoded;
  row.classList.toggle("sel", selected);
  row.setAttribute("aria-expanded", selected ? "true" : "false");
  if (hasTextSelectionWithin(row)) return;
  const stateBadge = row.querySelector(".badge");
  stateBadge.className = `badge b-${stateClass}`;
  setTextIfChanged(stateBadge, state);
  setTextIfChanged(row.querySelector(".def"), kind || "");
  setTextIfChanged(row.querySelector(".ws"), shortWs(workspace));
  setTextIfChanged(
    row.querySelector(".metric-best"),
    best == null ? "—" : `${Number(best).toFixed(3)}×`,
  );
  const instanceValue = row.querySelector(".metric-instance");
  setTextIfChanged(instanceValue, instance);
  instanceValue.title = instance === "—" ? "" : instance;
  setTextIfChanged(
    row.querySelector(".metric-rounds"),
    rounds == null ? "—" : `${Number(rounds)} rounds`,
  );
}

function bindRunEntry(entry) {
  const row = entry.querySelector(".run");
  if (row.dataset.listenerReady) return;
  row.dataset.listenerReady = "1";
  const activate = () => selectRun(decodeURIComponent(row.dataset.ws));
  row.addEventListener("click", () => {
    if (hasTextSelectionWithin(row)) return;
    activate();
  });
  row.addEventListener("keydown", (event) => {
    if (event.key !== "Enter" && event.key !== " ") return;
    event.preventDefault();
    activate();
  });
}

function createRunEntry(run) {
  const entry = document.createElement("div");
  entry.className = "run-entry";
  entry.innerHTML = `<div class="run" role="button" tabindex="0" aria-expanded="false">
    <div class="main">
      <div class="top"><span class="badge"></span><span class="def"></span></div>
      <div class="ws"></div>
    </div>
    <div class="metrics">
      <div class="metric best-metric"><span class="metric-label">Best</span><span class="metric-value metric-best"></span></div>
      <div class="metric"><span class="metric-label">Instance</span><span class="metric-value metric-instance"></span></div>
      <div class="metric"><span class="metric-label">Rounds</span><span class="metric-value metric-rounds"></span></div>
    </div>
  </div>`;
  updateRunEntry(entry, run);
  bindRunEntry(entry);
  return entry;
}

function reconcileRunList(list, runs) {
  const existing = new Map(
    Array.from(list.querySelectorAll(".run-entry"))
      .map((entry) => [decodeURIComponent(entry.dataset.ws), entry])
  );
  const wanted = new Set(runs.map((run) => run.workspace));
  let cursor = list.firstElementChild;

  runs.forEach((run) => {
    const entry = existing.get(run.workspace) || createRunEntry(run);
    updateRunEntry(entry, run);
    bindRunEntry(entry);
    if (entry !== cursor) list.insertBefore(entry, cursor);
    cursor = entry.nextElementSibling;
  });

  Array.from(list.children).forEach((child) => {
    if (!child.classList.contains("run-entry")) child.remove();
    else if (!wanted.has(decodeURIComponent(child.dataset.ws))) child.remove();
  });
}

async function loadRuns() {
  try {
    const data = await api("/api/runs");
    $("live").classList.add("live");
    runsLoaded = true;
    const runs = data.runs || [];
    const list = $("runlist");
    if (!runs.length) {
      clearRunSelection();
      list.innerHTML = '<div class="empty">No runs yet. Submit one on the left.</div>';
      return;
    }
    if (selectedWs && !runs.some((run) => run.workspace === selectedWs)) {
      clearRunSelection();
    }
    reconcileRunList(list, runs);
    if (selectedWs) {
      const selectedEntry = Array.from(list.querySelectorAll(".run-entry"))
        .find((entry) => decodeURIComponent(entry.dataset.ws) === selectedWs);
      if (selectedEntry) {
        selectedEntry.classList.add("expanded");
        if (!detailSelectionActive(selectedWs)) refreshDetail();
      } else {
        clearRunSelection();
      }
    }
  } catch (e) {
    $("live").classList.remove("live");
    if (!runsLoaded) {
      $("runlist").innerHTML = '<div class="empty">Connecting to service…</div>';
    }
  }
}

async function selectRun(ws) {
  if (ws === selectedWs) {
    clearRunSelection();
    return;
  }
  activityState = {
    workspace: ws,
    events: [],
    nextSequence: null,
    hasMore: false,
    loaded: false,
  };
  resetActivityView(ws);
  selectedWs = ws;
  document.querySelectorAll(".run").forEach((el) => {
    const selected = decodeURIComponent(el.dataset.ws) === ws;
    el.classList.toggle("sel", selected);
    el.setAttribute("aria-expanded", selected ? "true" : "false");
  });
  if (mountDetail()) refreshDetail();
}

const TERMINAL_STATES = new Set([
  "SUCCEEDED", "GENERATED", "FAILED", "CANCELLED", "INTERRUPTED",
  "INFRASTRUCTURE_ERROR", "SUBMISSION_FAILED",
]);
const ERROR_STATES = new Set([
  "FAILED", "INFRASTRUCTURE_ERROR", "SUBMISSION_FAILED", "INTERRUPTED",
]);

function esc(text) {
  return String(text == null ? "" : text).replace(/[&<>"']/g, (c) =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function fmtTs(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} `
       + `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function fmtDuration(startIso, endIso) {
  if (!startIso) return "";
  const start = new Date(startIso);
  const end = endIso ? new Date(endIso) : new Date();
  const ms = end - start;
  if (isNaN(ms) || ms < 0) return "";
  if (ms < 1000) return `${ms}ms`;
  const s = Math.floor(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ${s % 60}s`;
  const h = Math.floor(m / 60);
  return `${h}h ${m % 60}m`;
}

function renderHero(s) {
  const mode = s.mode ? esc(s.mode) : "";
  const hw = s.target_hardware ? esc(s.target_hardware) : "";
  const meta = [mode, hw].filter(Boolean).join(" · ");
  const kind = s.kind === "batch"
    ? `batch (${s.total_tasks} tasks)`
    : (s.definition || "(no definition)");
  return `<div class="section hero">
    <div class="def">${esc(kind)}</div>
    ${meta ? `<div class="meta">${meta}</div>` : ""}
  </div>`;
}

function renderErrorIfAny(s) {
  if (!ERROR_STATES.has(s.state)) return "";
  const p = s.progress || {};
  const proc = s.process || {};
  const message =
    p.message || p.stop_reason || proc.message || "(no message)";
  return `<div class="error-box">
    <div class="head">⚠ ${esc(s.state)}</div>
    <div class="error-message">${esc(message)}</div>
  </div>`;
}

async function loadActivity(workspace) {
  if (activityState.workspace !== workspace) return;
  for (let page = 0; page < 4; page += 1) {
    const cursor = activityState.nextSequence;
    let path = "/api/activity?workspace=" + encodeURIComponent(workspace);
    if (cursor != null) path += "&after_sequence=" + encodeURIComponent(cursor);
    try {
      const data = await api(path);
      if (selectedWs !== workspace || activityState.workspace !== workspace) return;
      const events = new Map(activityState.events.map((event) => [event.sequence, event]));
      (data.events || []).forEach((event) => events.set(event.sequence, event));
      activityState.events = Array.from(events.values())
        .sort((a, b) => a.sequence - b.sequence)
        .slice(-ACTIVITY_CLIENT_LIMIT);
      activityState.nextSequence = data.next_sequence;
      activityState.hasMore = Boolean(data.has_more);
      activityState.loaded = true;
      if (!activityState.hasMore) return;
    } catch (e) {
      // Keep the last successful feed and retry on the next detail refresh.
      return;
    }
  }
}

function activityRowMarkup(event) {
  const level = String(event.level || "INFO").toUpperCase();
  const levelClass = level === "ERROR" ? "error" : (level === "WARNING" ? "warning" : "");
  const location = [event.stage, event.scope].filter(Boolean).join(" · ");
  const message = event.message || String(event.event_type || "activity")
    .replace(/_/g, " ").toLowerCase();
  return `<div class="activity-row ${levelClass}" data-sequence="${Number(event.sequence)}">
    <div class="activity-meta">
      <span>${esc(fmtTs(event.recorded_at))}</span>
      <span class="activity-level">${esc(level)}</span>
      <span class="activity-type">${esc(event.event_type)}</span>
      ${location ? `<span>${esc(location)}</span>` : ""}
    </div>
    <div class="activity-message">${esc(message)}</div>
  </div>`;
}

function createActivitySection() {
  const section = document.createElement("div");
  section.className = "section activity";
  section.innerHTML = '<div class="title"></div><div class="activity-feed" id="activityFeed"></div>';
  return section;
}

function syncActivitySection(section) {
  const feed = section.querySelector(".activity-feed");
  const title = section.querySelector(".title");
  const suffix = activityState.hasMore ? " · catching up" : "";
  title.textContent = `Recent activity${suffix}`;

  const events = activityState.events;
  if (!events.length) {
    const empty = document.createElement("div");
    empty.className = "activity-empty";
    empty.textContent = activityState.loaded ? "No recent activity." : "Loading activity…";
    while (feed.firstChild) feed.removeChild(feed.firstChild);
    feed.appendChild(empty);
    return;
  }

  const activityEmpty = feed.querySelector(".activity-empty");
  if (activityEmpty) activityEmpty.remove();
  const wanted = new Set(events.map((event) => String(Number(event.sequence))));
  const rows = new Map();
  feed.querySelectorAll(".activity-row").forEach((row) => {
    if (wanted.has(row.dataset.sequence)) rows.set(row.dataset.sequence, row);
    else row.remove();
  });
  events.forEach((event) => {
    const sequence = String(Number(event.sequence));
    if (rows.has(sequence)) return;
    const template = document.createElement("template");
    template.innerHTML = activityRowMarkup(event).trim();
    const row = template.content.firstElementChild;
    feed.appendChild(row);
    rows.set(sequence, row);
  });
}

function renderProgress(s) {
  const p = s.progress || {};
  if (p.current_round == null && p.best_geo_mean == null && !p.stage) return "";
  const cur = p.current_round == null ? 0 : p.current_round;
  const max = p.max_round || 1;
  const pct = Math.min(100, (cur / max) * 100);
  const bestBlock = p.best_geo_mean != null
    ? `<div class="best">
        <span class="num">${Number(p.best_geo_mean).toFixed(3)}x</span>
        <span class="lbl">best geo_mean${p.best_round ? ` · round ${p.best_round}` : ""}</span>
      </div>`
    : "";
  return `<div class="section progress">
    <div class="title">Progress</div>
    ${p.current_round != null ? `
      <div class="row">
        <span class="rd">round ${cur}/${p.max_round || "?"}</span>
        <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
        ${p.stage ? `<span class="stage">${esc(p.stage)}</span>` : ""}
      </div>` : (p.stage ? `<div class="stage">${esc(p.stage)}</div>` : "")}
    ${bestBlock}
  </div>`;
}

function renderCounts(s) {
  if (s.kind !== "batch" && !((s.progress || {}).total_tasks)) return "";
  if (s.kind === "batch") {
    const c = s.counts || {};
    const total = s.total_tasks || 0;
    const done = c.SUCCEEDED || 0;
    const failed = (c.FAILED || 0) + (c.INFRASTRUCTURE_ERROR || 0) + (c.SUBMISSION_FAILED || 0);
    const cancelled = c.CANCELLED || 0;
    const pending = total - done - failed - cancelled;
    return `<div class="section">
      <div class="title">Tasks</div>
      <div class="counts">
        <div class="c ok"><b>${done}</b> succeeded</div>
        <div class="c err"><b>${failed}</b> failed</div>
        <div class="c warn"><b>${cancelled}</b> cancelled</div>
        <div class="c mut"><b>${pending}</b> pending</div>
        <div class="c mut"><b>${total}</b> total</div>
      </div>
    </div>`;
  }
  const p = s.progress || {};
  return `<div class="section">
    <div class="title">Tasks</div>
    <div class="counts">
      <div class="c ok"><b>${p.completed_tasks || 0}</b> completed</div>
      <div class="c err"><b>${p.failed_tasks || 0}</b> failed</div>
      <div class="c warn"><b>${p.cancelled_tasks || 0}</b> cancelled</div>
      <div class="c mut"><b>${p.total_tasks || 0}</b> total</div>
    </div>
  </div>`;
}

function renderTiming(s) {
  const proc = s.process || {};
  if (!proc.submitted_at) return "";
  const finished = proc.finished_at;
  return `<div class="section">
    <div class="title">Timing</div>
    <div class="meta-kv">
      <div class="k">submitted</div><div class="v">${esc(fmtTs(proc.submitted_at))}</div>
      ${proc.started_at ? `<div class="k">started</div><div class="v">${esc(fmtTs(proc.started_at))}</div>` : ""}
      ${finished ? `<div class="k">finished</div><div class="v">${esc(fmtTs(finished))}</div>` : ""}
      ${proc.started_at ? `<div class="k">duration</div><div class="v">${esc(fmtDuration(proc.started_at, finished))}</div>` : ""}
    </div>
  </div>`;
}

function renderMetadata(s) {
  return `<div class="section">
    <div class="title">Metadata</div>
    <div class="meta-kv">
      <div class="k">run_id</div><div class="v">${esc(s.run_id || "-")}</div>
      <div class="k">workspace</div><div class="v">${esc(s.workspace)}</div>
      ${s.eval_server ? `<div class="k">eval_server</div><div class="v">${esc(s.eval_server)}</div>` : ""}
      ${s.worker_pool ? `<div class="k">worker_pool</div><div class="v">${esc(s.worker_pool)}</div>` : ""}
      ${s.batch_workspace ? `<div class="k">batch</div><div class="v">${esc(s.batch_workspace)}</div>` : ""}
    </div>
  </div>`;
}

function renderChildren(s) {
  if (s.kind !== "batch" || !s.runs) return "";
  return `<div class="section">
    <div class="title">Children</div>
    <div class="child-list">
      ${s.runs.map((r) => {
        const p = r.progress || {};
        return `<div class="child-row">
          ${badge(r.state)}
          <span class="def">${esc(r.definition || "-")}</span>
          <span class="spacer" style="flex:1"></span>
          ${p.stage ? `<span class="stage">${esc(p.stage)}</span>` : ""}
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

function isRunBest(history, series, round) {
  return series.scope === history.best_scope
    && round.round === history.best_round
    && round.is_final_best;
}

function renderSpeedupChart(history, series) {
  const points = (series.rounds || [])
    .filter((round) => round.status === "PASSED" && !round.is_hack
      && Number.isFinite(Number(round.geo_mean)))
    .map((round) => ({
      round,
      xValue: Number(round.round),
      yValue: Number(round.geo_mean),
      best: isRunBest(history, series, round),
    }));
  if (!points.length) {
    return `<div class="speedup-chart"><div class="speedup-empty">No valid speedup measurements yet.</div></div>`;
  }

  const width = 640;
  const height = 190;
  const pad = { left: 48, right: 20, top: 24, bottom: 30 };
  const plotWidth = width - pad.left - pad.right;
  const plotHeight = height - pad.top - pad.bottom;
  const xMin = Math.min(...points.map((point) => point.xValue));
  const xMax = Math.max(...points.map((point) => point.xValue));
  const measured = points.map((point) => point.yValue);
  const rawMin = Math.min(1, ...measured);
  const rawMax = Math.max(1, ...measured);
  const yPadding = Math.max((rawMax - rawMin) * 0.12, 0.04);
  const yMin = rawMin - yPadding;
  const yMax = rawMax + yPadding;
  const xAt = (value) => xMin === xMax
    ? pad.left + plotWidth / 2
    : pad.left + ((value - xMin) / (xMax - xMin)) * plotWidth;
  const yAt = (value) => pad.top + ((yMax - value) / (yMax - yMin)) * plotHeight;
  const coords = points.map((point) => ({
    ...point,
    x: xAt(point.xValue),
    y: yAt(point.yValue),
  }));
  const line = coords.length > 1
    ? `<polyline class="speedup-line" points="${coords.map((point) => `${point.x.toFixed(1)},${point.y.toFixed(1)}`).join(" ")}" />`
    : "";
  const baselineY = yAt(1);
  const best = coords.find((point) => point.best) || null;
  const bestLabel = best
    ? `<text class="speedup-best-label" x="${best.x > width - 125 ? best.x - 8 : best.x + 8}" y="${Math.max(16, best.y - 13)}" text-anchor="${best.x > width - 125 ? "end" : "start"}">best ${best.yValue.toFixed(3)}x · R${best.xValue}</text>`
    : "";
  return `<div class="speedup-chart">
    <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Speedup by pass for ${esc(series.scope)}">
      <title>Speedup by pass for ${esc(series.scope)}</title>
      <line class="speedup-grid" x1="${pad.left}" y1="${pad.top}" x2="${width - pad.right}" y2="${pad.top}" />
      <line class="speedup-grid" x1="${pad.left}" y1="${height - pad.bottom}" x2="${width - pad.right}" y2="${height - pad.bottom}" />
      <line class="speedup-baseline" x1="${pad.left}" y1="${baselineY.toFixed(1)}" x2="${width - pad.right}" y2="${baselineY.toFixed(1)}" />
      <text class="speedup-label" x="${pad.left - 7}" y="${pad.top + 4}" text-anchor="end">${yMax.toFixed(2)}x</text>
      <text class="speedup-label" x="${pad.left - 7}" y="${height - pad.bottom + 4}" text-anchor="end">${yMin.toFixed(2)}x</text>
      <text class="speedup-label" x="${pad.left - 7}" y="${baselineY + 4}" text-anchor="end">1.00x</text>
      <text class="speedup-label" x="${xAt(xMin)}" y="${height - 10}" text-anchor="middle">R${xMin}</text>
      ${xMax !== xMin ? `<text class="speedup-label" x="${xAt(xMax)}" y="${height - 10}" text-anchor="middle">R${xMax}</text>` : ""}
      ${line}
      ${coords.map((point) => `${point.best ? `<circle class="speedup-best-halo" cx="${point.x.toFixed(1)}" cy="${point.y.toFixed(1)}" r="10" />` : ""}<circle class="speedup-point${point.best ? " best-point" : ""}" cx="${point.x.toFixed(1)}" cy="${point.y.toFixed(1)}" r="${point.best ? 5 : 4}"><title>Round ${point.xValue}: ${point.yValue.toFixed(3)}x${point.best ? " (run best)" : ""}</title></circle>`).join("")}
      ${bestLabel}
    </svg>
  </div>`;
}

function renderRoundSeries(history, series, showScope) {
  const rounds = series.rounds || [];
  const bestSummary = series.best_geo_mean != null
    ? `best ${Number(series.best_geo_mean).toFixed(3)}x · round ${series.best_round}`
    : "no valid result";
  return `<div class="history-series">
    ${showScope ? `<div class="history-series-head"><span class="scope">${esc(series.scope)}</span><span class="summary">${bestSummary}</span></div>` : ""}
    ${renderSpeedupChart(history, series)}
    <div class="rounds-wrap"><table class="rounds-table"><thead>
      <tr><th>pass</th><th>status</th><th class="num">geo_mean</th><th class="num">best so far</th></tr>
    </thead><tbody>
      ${rounds.map((round) => {
        const best = isRunBest(history, series, round);
        return `<tr class="${best ? "best-row" : ""} ${round.is_hack ? "hack-row" : ""}">
          <td class="num">${round.round}</td>
          <td class="st">${esc(round.status)}${round.is_hack ? " ⚠hack" : ""}${best ? ' <span class="best-tag">★ RUN BEST</span>' : ""}</td>
          <td class="num">${round.geo_mean != null ? Number(round.geo_mean).toFixed(3) : "-"}</td>
          <td class="num">${round.best_geo_mean_so_far != null ? Number(round.best_geo_mean_so_far).toFixed(3) : "-"}</td>
        </tr>`;
      }).join("")}
    </tbody></table></div>
  </div>`;
}

function renderRoundHistory(history) {
  const series = ((history && history.series) || []).filter((item) => (item.rounds || []).length);
  if (!series.length) return "";
  const roundCount = series.reduce((total, item) => total + item.rounds.length, 0);
  const showScope = series.length > 1 || series[0].scope !== ".";
  return `<div class="section speedup-history">
    <div class="title">Speedup by pass · ${roundCount}</div>
    ${series.map((item) => renderRoundSeries(history, item, showScope)).join("")}
  </div>`;
}

async function refreshDetail() {
  if (!selectedWs) return;
  if (detailRefreshing) {
    detailRefreshQueued = true;
    return;
  }
  detailRefreshing = true;
  const requestWs = selectedWs;
  try {
    const s = await api("/api/status?workspace=" + encodeURIComponent(requestWs));
    if (selectedWs !== requestWs) return;
    const canCancel = !TERMINAL_STATES.has(s.state);
    if (s.kind !== "batch") await loadActivity(requestWs);
    if (selectedWs !== requestWs) return;
    let history = null;
    const progress = s.progress || {};
    if (s.kind !== "batch" && (progress.current_round || TERMINAL_STATES.has(s.state))) {
      // Best-effort history — no history when the ledger doesn't exist yet.
      try { history = await api("/api/history?workspace=" + encodeURIComponent(requestWs)); }
      catch (e) { /* keep null */ }
    }
    if (selectedWs !== requestWs) return;
    if (detailSelectionActive(requestWs)) return;
    captureActivityScroll();
    const preservedFeed = $("activityFeed");
    if (preservedFeed) preservedFeed.removeEventListener("scroll", captureActivityScroll);
    const preservedActivity = preservedFeed ? preservedFeed.closest(".section.activity") : null;
    const showActivity = s.kind !== "batch" && activityState.workspace === s.workspace;
    $("detail").innerHTML = `
      <div class="head">
        <h2>Detail</h2>${badge(s.state)}
        <span class="spacer" style="flex:1"></span>
        ${canCancel ? '<button class="danger" id="cancelBtn">Cancel</button>' : ''}
      </div>
      ${renderHero(s)}
      ${renderErrorIfAny(s)}
      ${showActivity ? '<div id="activitySlot"></div>' : ""}
      ${renderProgress(s)}
      ${renderCounts(s)}
      ${renderChildren(s)}
      ${renderTiming(s)}
      ${renderMetadata(s)}
      ${renderRoundHistory(history)}
      <details class="raw"><summary>Raw JSON</summary><pre>${esc(JSON.stringify(s, null, 2))}</pre></details>
    `;
    $("detail").dataset.workspace = requestWs;
    if (showActivity) {
      const activitySection = preservedActivity || createActivitySection();
      syncActivitySection(activitySection);
      const activitySlot = $("activitySlot");
      activitySlot.parentNode.replaceChild(activitySection, activitySlot);
    }
    restoreActivityScroll();
    const cb = $("cancelBtn");
    if (cb) cb.addEventListener("click", cancelSelected);
  } catch (e) {
    if (selectedWs === requestWs) {
      $("detail").innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`;
      $("detail").dataset.workspace = requestWs;
    }
  } finally {
    detailRefreshing = false;
    if (detailRefreshQueued) {
      detailRefreshQueued = false;
      refreshDetail();
    }
  }
}

async function cancelSelected() {
  if (!selectedWs) return;
  try {
    await api("/api/cancel", { method: "POST", body: JSON.stringify({ workspace: selectedWs, reason: "cancelled via console" }) });
    refreshDetail(); loadRuns();
  } catch (e) { alert("Cancel failed: " + e.message); }
}

$("submitForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const mode = $("mode").value;
  const options = {
    mode,
    target_hardware: $("target_hardware").value.trim(),
    eval_server: $("eval_server").value.trim(),
    max_round: Number($("max_round").value),
  };
  if (mode === "kernelgen") options.n_parallel = Number($("n_parallel").value);
  const payload = { definition: $("definition").value.trim(), options };
  const ws = $("workspace").value.trim();
  if (ws) payload.workspace = ws;
  const msg = $("submitMsg");
  msg.className = "msg";
  try {
    const r = await api("/api/runs", { method: "POST", body: JSON.stringify(payload) });
    msg.textContent = `Submitted ${r.run_id.slice(0,12)}… (pid ${r.pid})`;
    msg.className = "msg ok show";
    await loadRuns();
    selectRun(r.workspace);
  } catch (e) {
    msg.textContent = e.message;
    msg.className = "msg err show";
  }
});

$("refreshBtn").addEventListener("click", () => {
  loadRuns(); loadDeviceInstances();
});

let devicePresets = [];
let fleetSnapshot = { updated_at: null, daemon_running: false, devices: [], instances: [] };
let deploymentSnapshot = [];
let activeDeploymentId = null;
let selectedInstanceId = null;
let stopRequestActive = false;

async function loadDevices() {
  try {
    const data = await api("/api/devices");
    devicePresets = data.devices || [];
    renderMachineOptions();
  } catch (e) { /* presets are an optional fallback */ }
}

function fleetIsActive() {
  return Boolean(fleetSnapshot.updated_at && fleetSnapshot.daemon_running);
}

function machineStateLabel(machine) {
  const connection = machine.connection_state
    || (machine.state === "unknown" ? "unreachable" : "reachable");
  if (connection !== "reachable") return "unreachable";
  const kgs = machine.kgs_state || ({
    ok: "running",
    down: "not_running",
    degraded: "degraded",
  })[machine.state] || "unknown";
  if (kgs === "running") return "reachable · KGS running";
  if (kgs === "not_running") return "reachable · KGS not running";
  if (kgs === "degraded") return "reachable · KGS degraded";
  return "reachable · KGS status unknown";
}

function renderMachineOptions() {
  const sel = $("machine");
  const current = sel.value;
  const machines = fleetIsActive()
    ? (fleetSnapshot.devices || []).map((item) => ({
        name: item.name,
        label: `${item.name}${item.address ? ` · ${item.address}` : ""} (${item.target_hardware}) — ${machineStateLabel(item)}`,
      }))
    : devicePresets.map((item) => ({ name: item.name, label: item.label }));
  sel.innerHTML = "";
  machines.forEach((machine) => {
    const opt = document.createElement("option");
    opt.value = machine.name;
    opt.textContent = machine.label;
    sel.appendChild(opt);
  });
  if (!machines.length) {
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "(no configured machines)";
    opt.disabled = true;
    sel.appendChild(opt);
  }
  if (machines.some((item) => item.name === current)) sel.value = current;
  if (!sel.dataset.listenerReady) {
    sel.dataset.listenerReady = "1";
    sel.addEventListener("change", () => {
      sel.dataset.userPicked = "1";
      selectedInstanceId = null;
      renderDeviceInstances();
    });
  }
  renderDeviceInstances();
}

const INSTANCE_UNAVAILABLE_LABELS = {
  proxy_unavailable: "proxy unavailable",
  endpoint_unhealthy: "endpoint unhealthy",
  incompatible_api: "incompatible API",
  target_unavailable: "target unavailable",
  candidate_admission_missing: "candidate admission unsupported",
  evaluation_binding_missing: "evaluation binding unsupported",
  scheduler_unhealthy: "scheduler unhealthy",
};

function instanceUnavailableLabel(instance) {
  return INSTANCE_UNAVAILABLE_LABELS[instance.unavailable_reason] || "unavailable";
}

function instanceLabel(instance) {
  const version = instance.server_version || instance.api_version || "version unknown";
  const backend = instance.backend ? ` · ${instance.backend}` : "";
  const status = instance.proxy_state === "running"
    ? instance.status
    : `proxy ${instance.proxy_state || "unknown"}`;
  const unavailable = instance.selectable === false
    ? ` · ${instanceUnavailableLabel(instance)}`
    : "";
  return `${version}${backend} — ${status}${unavailable}`;
}

function selectedManagedDeployment() {
  const instanceId = selectedInstanceId || $("device").value;
  return deploymentSnapshot.find((item) =>
    item.instance_id === instanceId && item.status === "ready"
  ) || null;
}

function updateStopButton() {
  const deployment = selectedManagedDeployment();
  const button = $("stopInstanceBtn");
  button.hidden = !deployment;
  button.disabled = !deployment || stopRequestActive;
  button.textContent = stopRequestActive ? "Stopping…" : "Stop";
}

function renderDeviceInstances() {
  const machine = $("machine").value;
  const sel = $("device");
  const current = selectedInstanceId || sel.value;
  sel.innerHTML = "";
  let instances = [];
  if (fleetIsActive()) {
    instances = (fleetSnapshot.instances || []).filter((item) => item.device === machine);
    instances.forEach((instance) => {
      const opt = document.createElement("option");
      opt.value = instance.instance_id;
      opt.dataset.hw = instance.target_hardware || "";
      opt.dataset.es = instance.eval_server || "";
      opt.disabled = !instance.selectable;
      opt.textContent = instanceLabel(instance);
      if (opt.disabled) opt.title = instanceUnavailableLabel(instance);
      sel.appendChild(opt);
    });
  } else {
    const preset = devicePresets.find((item) => item.name === machine);
    if (preset) {
      const opt = document.createElement("option");
      opt.value = preset.name;
      opt.dataset.hw = preset.target_hardware;
      opt.dataset.es = preset.eval_server;
      opt.textContent = "configured instance";
      sel.appendChild(opt);
    }
  }
  if (!sel.options.length) {
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "(no KGS instances)";
    opt.disabled = true;
    sel.appendChild(opt);
  }
  const currentOption = Array.from(sel.options).find((opt) => opt.value === current);
  if (currentOption) {
    sel.value = current;
  } else if (selectedInstanceId) {
    const unavailable = document.createElement("option");
    unavailable.value = selectedInstanceId;
    unavailable.textContent = "(selected KGS unavailable)";
    unavailable.disabled = true;
    sel.appendChild(unavailable);
    sel.value = selectedInstanceId;
  } else {
    const firstAvailable = Array.from(sel.options).find((opt) => !opt.disabled);
    if (firstAvailable) sel.value = firstAvailable.value;
  }
  $("addInstanceBtn").disabled = !fleetIsActive() || !machine;
  applyDevice(sel.value);
  updateStopButton();
}

async function loadDeviceInstances() {
  try {
    fleetSnapshot = await api("/api/device-instances");
    renderMachineOptions();
    await loadDeployments();
  } catch (e) { /* retain the last usable selector state */ }
}

function applyDevice(name) {
  const opt = Array.from($("device").options).find((item) => item.value === name);
  if (!opt) return;
  $("target_hardware").value = opt.dataset.hw || "";
  $("eval_server").value = opt.dataset.es || "";
  $("submitBtn").disabled = opt.disabled || !opt.dataset.es;
}

$("device").addEventListener("change", () => {
  selectedInstanceId = $("device").value;
  applyDevice(selectedInstanceId);
  updateStopButton();
});

async function openAddInstance() {
  const machine = $("machine").value;
  if (!machine) return;
  $("addMachine").value = machine;
  $("installFlagGems").checked = true;
  const msg = $("addInstanceMsg");
  msg.className = "msg";
  msg.textContent = "";
  try {
    const data = await api("/api/kgs-versions");
    const versions = data.versions || [];
    $("kgsVersion").innerHTML = versions.map((item) =>
      `<option value="${esc(item.name)}">${esc(item.name)}${item.recommended ? " (recommended)" : ""}</option>`
    ).join("");
    $("confirmAddInstance").disabled = !versions.length;
    $("addInstanceDialog").showModal();
  } catch (e) {
    alert("Cannot load KGS versions: " + e.message);
  }
}

async function loadDeployments() {
  try {
    const data = await api("/api/kgs-deployments");
    deploymentSnapshot = data.deployments || [];
    renderDeviceInstances();
    if (!activeDeploymentId) return;
    const deployment = deploymentSnapshot
      .find((item) => item.deployment_id === activeDeploymentId);
    if (!deployment) return;
    const msg = $("addInstanceMsg");
    if (deployment.status === "ready") {
      msg.textContent = "KGS instance is ready.";
      msg.className = "msg ok show";
      activeDeploymentId = null;
      return;
    }
    if (deployment.status === "failed") {
      msg.textContent = `KGS startup failed (${deployment.error_category || "unknown"}).`;
      msg.className = "msg err show";
      activeDeploymentId = null;
      $("confirmAddInstance").disabled = false;
      return;
    }
    msg.textContent = deployment.status === "installing_flaggems"
      ? "Installing compatible FlagGems…"
      : deployment.status === "waiting_for_fleet"
        ? "KGS started; waiting for compatibility checks…"
        : "Starting KGS…";
    msg.className = "msg ok show";
  } catch (e) { /* retry with the normal instance polling loop */ }
}

async function stopSelectedInstance() {
  const deployment = selectedManagedDeployment();
  if (!deployment) return;
  if (!confirm("Stop this managed KGS instance?")) return;
  const msg = $("instanceMsg");
  stopRequestActive = true;
  updateStopButton();
  msg.textContent = "Stopping managed KGS instance…";
  msg.className = "msg ok show";
  try {
    const result = await api(`/api/kgs-deployments/${encodeURIComponent(deployment.deployment_id)}/stop`, {
      method: "POST",
    });
    if (result.status === "stopped") {
      msg.textContent = "Managed KGS instance stopped.";
    } else {
      msg.textContent = "Managed KGS stop is already in progress…";
    }
    msg.className = "msg ok show";
    await loadDeviceInstances();
  } catch (e) {
    msg.textContent = e.message;
    msg.className = "msg err show";
  } finally {
    stopRequestActive = false;
    updateStopButton();
  }
}

$("addInstanceBtn").addEventListener("click", openAddInstance);
$("stopInstanceBtn").addEventListener("click", stopSelectedInstance);
$("cancelAddInstance").addEventListener("click", () => $("addInstanceDialog").close());
$("addInstanceForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const msg = $("addInstanceMsg");
  $("confirmAddInstance").disabled = true;
  msg.textContent = "Starting KGS…";
  msg.className = "msg ok show";
  try {
    const record = await api("/api/kgs-instances", {
      method: "POST",
      body: JSON.stringify({
        machine: $("addMachine").value,
        version: $("kgsVersion").value,
        install_flaggems: $("installFlagGems").checked,
      }),
    });
    activeDeploymentId = record.deployment_id;
  } catch (e) {
    msg.textContent = e.message;
    msg.className = "msg err show";
    $("confirmAddInstance").disabled = false;
  }
});

let definitionNames = [];
let visibleDefinitionNames = [];
let activeDefinitionIndex = -1;
const DEFINITION_RENDER_LIMIT = 60;

function setDefinitionHint(message, error = false) {
  const hint = $("definitionHint");
  hint.textContent = message;
  hint.classList.toggle("error", error);
}

function closeDefinitionList() {
  const input = $("definition");
  const list = $("definitionListbox");
  list.hidden = true;
  input.setAttribute("aria-expanded", "false");
  input.removeAttribute("aria-activedescendant");
  activeDefinitionIndex = -1;
}

function matchingDefinitions(value) {
  const query = value.trim().toLowerCase();
  if (!query) return definitionNames.slice();
  const prefix = [];
  const contains = [];
  definitionNames.forEach((name) => {
    const normalized = name.toLowerCase();
    if (normalized.indexOf(query) === 0) prefix.push(name);
    else if (normalized.indexOf(query) !== -1) contains.push(name);
  });
  return prefix.concat(contains);
}

function updateActiveDefinition(nextIndex) {
  const list = $("definitionListbox");
  const input = $("definition");
  const options = Array.from(list.querySelectorAll(".definition-option"));
  if (!options.length) {
    activeDefinitionIndex = -1;
    input.removeAttribute("aria-activedescendant");
    return;
  }
  activeDefinitionIndex = Math.max(0, Math.min(options.length - 1, nextIndex));
  options.forEach((option, index) => {
    const active = index === activeDefinitionIndex;
    option.classList.toggle("active", active);
    option.setAttribute("aria-selected", active ? "true" : "false");
  });
  const activeOption = options[activeDefinitionIndex];
  input.setAttribute("aria-activedescendant", activeOption.id);
  if (activeOption.offsetTop < list.scrollTop) {
    list.scrollTop = activeOption.offsetTop;
  } else if (activeOption.offsetTop + activeOption.offsetHeight > list.scrollTop + list.clientHeight) {
    list.scrollTop = activeOption.offsetTop + activeOption.offsetHeight - list.clientHeight;
  }
}

function selectDefinition(name) {
  $("definition").value = name;
  closeDefinitionList();
  setDefinitionHint(`${name} selected.`);
}

function renderDefinitionOptions() {
  const input = $("definition");
  const list = $("definitionListbox");
  const matches = matchingDefinitions(input.value);
  visibleDefinitionNames = matches.slice(0, DEFINITION_RENDER_LIMIT);
  while (list.firstChild) list.removeChild(list.firstChild);
  visibleDefinitionNames.forEach((name, index) => {
    const option = document.createElement("div");
    option.id = `definition-option-${index}`;
    option.className = "definition-option";
    option.setAttribute("role", "option");
    option.setAttribute("aria-selected", "false");
    option.textContent = name;
    option.addEventListener("mousedown", (event) => event.preventDefault());
    option.addEventListener("click", () => selectDefinition(name));
    list.appendChild(option);
  });
  activeDefinitionIndex = -1;
  input.removeAttribute("aria-activedescendant");
  list.hidden = !visibleDefinitionNames.length;
  input.setAttribute("aria-expanded", visibleDefinitionNames.length ? "true" : "false");
  if (!matches.length) {
    setDefinitionHint("No matching definitions. You can still enter a name.");
  } else if (matches.length > visibleDefinitionNames.length) {
    setDefinitionHint(`${matches.length} matches. Showing the first ${visibleDefinitionNames.length}.`);
  } else {
    setDefinitionHint(`${matches.length} matching definition${matches.length === 1 ? "" : "s"}.`);
  }
}

function bindDefinitionCombobox() {
  const input = $("definition");
  const root = $("definitionCombobox");
  input.addEventListener("focus", renderDefinitionOptions);
  input.addEventListener("input", renderDefinitionOptions);
  input.addEventListener("keydown", (event) => {
    if (event.key === "ArrowDown" || event.key === "ArrowUp") {
      event.preventDefault();
      if ($("definitionListbox").hidden) renderDefinitionOptions();
      const delta = event.key === "ArrowDown" ? 1 : -1;
      const start = activeDefinitionIndex < 0
        ? (delta > 0 ? 0 : visibleDefinitionNames.length - 1)
        : activeDefinitionIndex + delta;
      updateActiveDefinition(start);
    } else if (event.key === "Enter" && activeDefinitionIndex >= 0) {
      event.preventDefault();
      selectDefinition(visibleDefinitionNames[activeDefinitionIndex]);
    } else if (event.key === "Escape") {
      event.preventDefault();
      closeDefinitionList();
    }
  });
  input.addEventListener("blur", () => {
    window.setTimeout(() => {
      if (!root.contains(document.activeElement)) closeDefinitionList();
    }, 0);
  });
  const closeOutside = (event) => {
    if (!root.contains(event.target)) closeDefinitionList();
  };
  document.addEventListener("mousedown", closeOutside);
  document.addEventListener("touchstart", closeOutside, { passive: true });
}

async function loadDefinitions() {
  try {
    const data = await api("/api/definitions");
    const names = (data.definitions || []).filter(
      (name) => typeof name === "string" && name.trim()
    );
    definitionNames = Array.from(new Set(names)).sort();
    closeDefinitionList();
    setDefinitionHint(
      definitionNames.length
        ? `${definitionNames.length} definitions available. Type to filter.`
        : "No definitions are available. You can still enter a name.",
      !definitionNames.length
    );
    if (document.activeElement === $("definition")) renderDefinitionOptions();
  } catch (e) {
    definitionNames = [];
    visibleDefinitionNames = [];
    closeDefinitionList();
    setDefinitionHint("Definitions are temporarily unavailable. You can still enter a name.", true);
  }
}

bindDefinitionCombobox();

// Client-side polling (no SSE in v1). Refresh the list every 3s.
function startPolling() {
  const updateNParallelVisibility = () => {
    $("nParallelLabel").hidden = $("mode").value !== "kernelgen";
  };
  updateNParallelVisibility();
  $("mode").addEventListener("change", updateNParallelVisibility);
  loadServiceConfig();
  loadDevices().then(loadDeviceInstances);
  loadDefinitions();
  loadRuns();
  pollTimer = setInterval(loadRuns, 3000);
  instanceTimer = setInterval(loadDeviceInstances, 15000);
}
startPolling();
