name: auto_gen
version: 1.1.0
description: 为 FlagGems 生成新算子（实现 + 注册 + 测试 + benchmark）

prompt_template: prompts/generate_op.md

resources:
  gpu: 1
  workspace: true
  workspace_name_key: OPERATOR

inputs:
  OPERATOR: { type: string, required: true, desc: "算子名" }

outputs:
  operator:         { type: string, desc: "算子名" }
  status:           { type: "enum(success|failed)", desc: "执行结果" }
  accuracy_passed:  { type: bool, optional: true, desc: "正确性是否通过" }
  error_message:    { type: string, optional: true, desc: "失败原因" }
