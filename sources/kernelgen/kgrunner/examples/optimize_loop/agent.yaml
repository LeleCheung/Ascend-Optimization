name: optimize
version: 1.0.0
description: 单轮 kernel 性能优化

prompt_template: prompts/optimize.md

resources:
  gpu: 1
  workspace: true
  workspace_name_key: OPERATOR

inputs:
  OPERATOR: { type: string, required: true, desc: "算子名" }

outputs:
  operator:               { type: string, desc: "算子名" }
  status:                 { type: "enum(success|failed)", desc: "执行结果" }
  speedup:                { type: float, optional: true, desc: "本轮 speedup" }
  test_passed:            { type: bool, optional: true, desc: "正确性是否通过" }
  kernel_path:            { type: path, optional: true, desc: "kernel 文件相对路径" }
  optimization_direction: { type: string, optional: true, desc: "优化方向" }
  error:                  { type: string, optional: true, desc: "失败原因" }
