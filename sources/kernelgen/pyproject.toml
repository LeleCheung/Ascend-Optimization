[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelgen"
version = "6.7.0"
description = "Agent workflow for generating and optimizing accelerator kernels"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.27,<2",
  "pydantic>=2",
  "PyYAML>=6",
  "requests>=2.31",
  "kernelgen-server-client @ git+ssh://git@gitee.com/BaaiAC/kernelgen_server.git@1ebddd2f3c160a036c20fbed18986613e1992799#subdirectory=client",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.100", "uvicorn>=0.20", "httpx>=0.24"]
service = ["fastapi>=0.100", "uvicorn>=0.20"]

[project.scripts]
kg = "kernelgen.cli:main"
kg-service = "kernelgen.service.__main__:main"
kernelgen-mcp = "kernelgen.mcp_server.server:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["kernelgen", "kernelgen.*"]
namespaces = false

[tool.setuptools.package-data]
kernelgen = [
  "deployment/*.yaml",
  ".kernelgen/*.json",
  ".kernelgen/agents/*.md",
  ".kernelgen/skills/*/*.md",
  ".kernelgen/skills/*/references/*.md",
  ".kernelgen/skills/*/scripts/*.py",
  "scripts/remote_server/*.py",
  "service/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
