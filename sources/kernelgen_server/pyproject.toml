[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelgen-server"
version = "6.5.0"
description = "A hardware-neutral kernel evaluation service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "kernelgen-server-client==0.1.0",
  "safetensors>=0.4",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.100.0",
  "uvicorn>=0.20.0",
]
dev = [
  "httpx",
  "pytest>=7.0.0",
]

[project.scripts]
kernelgen-server = "kernelgen_server.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kernelgen_server*"]

[tool.setuptools.package-data]
kernelgen_server = [
  "runtime/source_policy.json",
  "evaluation/blacklists/*.yaml",
  "evaluation/graylists/*.yaml",
  "data/simple-v6-test/*.json",
  "data/simple-v6-test/definitions/*.json",
  "data/simple-v6-test/workloads/*.jsonl",
  "profiling/hygon/hygon_roctracer_compat/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
