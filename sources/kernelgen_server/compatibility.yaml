schema_version: 1

server_release:
  version: v6.5.0
  api_version: v6.2
  supported_api_versions:
    - v6.0
    - v6.2

frameworks:
  flaggems:
    repository: https://github.com/flagos-ai/FlagGems.git
    branch: kernelgen-dev
    revision_policy: branch

catalog_modes:
  v6.0:
    default_mode: adapter
    evaluator: flaggems
    layout: flat
    latest_validated_kgs: v6.3.1
  v6.2:
    default_mode: native
    evaluator: native
    layout: per-operator
    latest_validated_kgs: v6.3.1

kernelgen_releases:
  v6.1.1:
    required_api_version: v6.2
    latest_validated_kgs: v6.2.3
    validation_scope: host
  v6.1.2:
    required_api_version: v6.2
    latest_validated_kgs: v6.3.0
    validation_scope: host
  v6.2.0:
    required_api_version: v6.2
    latest_validated_kgs: v6.3.0
    validation_scope: host
