[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelgen-server-client"
version = "0.1.0"
description = "Pure protocol, Catalog, Bundle and HTTP client for KernelGen Server"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0", "requests>=2.31"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kernelgen_client*"]
