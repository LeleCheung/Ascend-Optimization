<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HG-KDA 当前入口</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f8fa; color: #20313c; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    main { max-width: 1180px; margin: 24px auto; padding: 24px; border: 1px solid #e2e8ee; border-radius: 16px; background: white; }
    h1 { margin: 0 0 8px; text-align: center; font-size: 26px; font-weight: 650; }
    svg { display: block; width: 100%; height: auto; }
    .node rect { stroke-width: 1.5; fill: #f8fafc; stroke: #cbd5e1; rx: 12; }
    .model rect { fill: #f2effa; stroke: #c4b5dd; }
    .core rect { fill: #edf8f3; stroke: #9dceba; }
    .backend rect { fill: #edf3fd; stroke: #b0c7e5; }
    .future rect { fill: #fafafa; stroke: #cbd5e1; stroke-dasharray: 6 5; }
    text { fill: #20313c; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; text-anchor: middle; }
    .title { font-size: 19px; font-weight: 600; }
    .sub { font-size: 15px; fill: #536674; }
    .label { font-size: 13px; fill: #657887; }
    .edge { fill: none; stroke: #8b9dad; stroke-width: 1.7; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 6 5; }
    @media (max-width: 600px) { main { margin: 0; padding: 12px 2px; border: 0; border-radius: 0; } h1 { font-size: 21px; } }
    @media print { @page { size: A4 landscape; margin: 8mm; } body { background: white; } main { max-width: none; margin: 0; padding: 0; border: 0; } h1 { font-size: 21px; } svg { max-height: 175mm; } }
  </style>
</head>
<body>
  <main>
    <h1>HG-KDA 当前入口</h1>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 940" role="img" aria-labelledby="diagram-title diagram-desc">
      <title id="diagram-title">HG-KDA skill、独立核心与后端的调用流程</title>
      <desc id="diagram-desc">用户任务交给模型宿主和 HG-KDA skill，经统一 CLI 调用独立 Python 核心和可选后端适配器。msprof 采集报告供核心分析，KGS 完成评测。统一 JSON 返回模型宿主，并供未来网页读取。</desc>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b9dad"/></marker>
      </defs>

      <path class="edge" d="M 560 102 V 150"/>
      <path class="edge" d="M 560 242 V 290"/>
      <path class="edge" d="M 560 366 V 400 H 330 V 440"/>
      <path class="edge" d="M 560 400 H 860 V 440"/>
      <path class="edge" d="M 860 516 V 560 H 750 V 610"/>
      <path class="edge" d="M 860 560 H 1000 V 610"/>
      <path class="edge dash" d="M 650 646 H 605 V 550 H 555"/>
      <text class="label" x="542" y="594">报告供分析工具读取</text>
      <path class="edge" d="M 330 556 V 755 H 470 V 810"/>
      <path class="edge" d="M 1000 686 V 755 H 700 V 810"/>
      <path class="edge" d="M 360 852 H 40 V 196 H 350"/>
      <path class="edge dash" d="M 800 852 H 875"/>
      <text class="label" x="838" y="832">后续接入</text>

      <g class="node">
        <rect x="350" y="30" width="420" height="72"/>
        <text class="title" x="560" y="61">用户任务</text>
        <text class="sub" x="560" y="86">算子、候选、测试要求</text>
      </g>
      <g class="node model">
        <rect x="350" y="150" width="420" height="92"/>
        <text class="title" x="560" y="186">模型宿主＋HG-KDA skill</text>
        <text class="sub" x="560" y="215">选择工具、判断瓶颈、修改 Triton</text>
      </g>
      <g class="node">
        <rect x="350" y="290" width="420" height="76"/>
        <text class="title" x="560" y="322">统一 CLI 入口</text>
        <text class="sub" x="560" y="348">hgkda / python -m hgkda</text>
      </g>
      <g class="node core">
        <rect x="105" y="440" width="450" height="116"/>
        <text class="title" x="330" y="473">独立 Python 核心</text>
        <text class="sub" x="330" y="505">成对对比 · Roofline · 热点与区域</text>
        <text class="sub" x="330" y="532">上下文与知识 · Triton 筛查</text>
      </g>
      <g class="node">
        <rect x="710" y="440" width="300" height="76"/>
        <text class="title" x="860" y="485">可选后端适配器</text>
      </g>
      <g class="node backend">
        <rect x="650" y="610" width="200" height="76"/>
        <text class="title" x="750" y="641">msprof</text>
        <text class="sub" x="750" y="669">真机／模拟器采集</text>
      </g>
      <g class="node backend">
        <rect x="900" y="610" width="200" height="76"/>
        <text class="title" x="1000" y="641">KGS</text>
        <text class="sub" x="1000" y="669">完整正确性与性能评测</text>
      </g>
      <g class="node core">
        <rect x="360" y="810" width="440" height="84"/>
        <text class="title" x="580" y="844">统一 JSON 结果</text>
        <text class="sub" x="580" y="873">证据、假设、来源与评测结果</text>
      </g>
      <g class="node future">
        <rect x="875" y="817" width="225" height="70"/>
        <text class="title" x="987.5" y="848">网页前端</text>
        <text class="sub" x="987.5" y="873">待开发</text>
      </g>
    </svg>
  </main>
</body>
</html>
