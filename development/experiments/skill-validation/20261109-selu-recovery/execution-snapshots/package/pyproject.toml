[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hgkda"
version = "0.1.0"
description = "昇腾算子的结构化性能诊断与严格 Triton 优化工作流"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hgkda = "hgkda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hgkda = ["data/**/*.json", "data/**/*.md"]
