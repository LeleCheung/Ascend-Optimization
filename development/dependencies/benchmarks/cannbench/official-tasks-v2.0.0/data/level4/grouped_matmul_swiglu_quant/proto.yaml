attrs:
- description: 每个专家的 token 累计和（cumsum），shape [E]，int32/int64
  name: group_list
  required: true
  type: Tensor
category: FusedComposite
description: MoE FFN 场景下的分组矩阵乘 + SwiGLU + 量化融合算子，对齐 torch_npu.npu_grouped_matmul_swiglu_quant_v2
  默认配置
difficulty: L4
formula: "对每个专家 g ∈ [0, E):\n  rows_g  = group_list 指定属于第 g 组的 token 行（cumsum 语义）\n\
  \  mm_g    = x[rows_g] @ weight[g]\n  deq_g   = mm_g * x_scale[rows_g] * weight_scale[g]\
  \   # 反量化\nleft, right = split(deq, last_dim / 2)\nact = SiLU(left) * right    \
  \                            # SwiGLU\ny, y_scale = PerTokenQuant(act)         \
  \                # 再量化\n"
inputs:
- description: 矩阵乘法左矩阵（激活，已完成 per-token 量化），支持非连续 Tensor
  dtype:
  - int8
  name: x
  shape: '[M, K]'
- description: 矩阵乘法右矩阵（权重），FRACTAL_NZ 格式
  dtype:
  - int8
  name: weight
  shape: '[E, K, N]'
- description: 权重反量化因子（per-channel）
  dtype:
  - float32
  name: weight_scale
  shape: '[E, N]'
- description: 激活 per-token 反量化因子
  dtype:
  - float32
  name: x_scale
  shape: '[M]'
name: GroupedMatmulSwigluQuant
outputs:
- description: SwiGLU 后的 per-token int8 量化输出
  dtype:
  - int8
  name: y
  shape: '[M, N/2]'
- description: 输出 per-token 反量化因子
  dtype:
  - float32
  name: y_scale
  shape: '[M]'
precision_thresholds:
  float32: 0.001
  int8: 1
schema: grouped_matmul_swiglu_quant(Tensor x, Tensor weight, Tensor weight_scale,
  Tensor x_scale, Tensor group_list) -> (Tensor y, Tensor y_scale)
shape_support: 'x: [M, K], weight: [E, K, N], weight_scale: [E, N], x_scale: [M];
  输出 y: [M, N/2], y_scale: [M]'
