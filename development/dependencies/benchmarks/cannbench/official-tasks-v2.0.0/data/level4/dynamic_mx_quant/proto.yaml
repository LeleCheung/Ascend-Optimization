attrs:
- default: -1
  description: 量化轴，范围 [-rank, rank-1]
  name: axis
  required: false
  type: int
- default: rint
  description: 舍入模式，支持 rint/floor/round（FP8 目标类型仅支持 rint）
  name: round_mode
  required: false
  type: str
- default: 40
  description: 输出量化类型编码，35=FP8_E5M2, 36=FP8_E4M3FN, 40=FP4_E2M1, 41=FP4_E1M2
  name: dst_type
  required: true
  type: int
- default: 32
  description: 量化分组大小，32 的倍数且不超过 1024
  name: blocksize
  required: false
  type: int
category: Quantization
description: 对输入张量执行 Microscaling (MX) 动态量化，按 blocksize 分组计算 E8M0 共享尺度，输出低精度量化结果和对应的量化
  scale；采用标准 OCP MX 算法 (floor(log2(amax)) - emax)，仅支持该 scale 计算方法
difficulty: L4
formula: 'shared_exp = floor(log2(max(|V_i|))) - emax;

  mxscale = 2^shared_exp;

  y_i = cast(V_i / mxscale, round_mode)

  '
inputs:
- description: 输入张量，1-7 维；目标类型为 FP4 时最后一维必须为偶数
  dtype:
  - float16
  - bfloat16
  name: x
name: DynamicMxQuant
outputs:
- description: 量化后的输出张量，与输入同 shape（dst_type 为 FP4 时最后一维减半，两元素打包为一个 uint8）
  dtype:
  - float8_e5m2
  - float8_e4m3fn
  - float4_e2m1
  - float4_e1m2
  name: y
- description: 量化 scale 张量，dtype 为 FP8_E8M0 (float8_e8m0fnu)，与 x 同 rank，量化轴维 = ceil(x.shape[axis]/blocksize)，其余维度与
    x 一致
  dtype:
  - float8_e8m0fnu
  name: mxscale
platform: Ascend 950PR / 950DT
schema: dynamic_mx_quant(Tensor x, int axis=-1, str round_mode="rint", int dst_type=40,
  int blocksize=32) -> (Tensor y, Tensor mxscale)
shape_support: 输入支持 1-7D 张量，输出 y 与输入同 shape（dst_type 为 FP4 时最后一维减半，两元素打包为一个 uint8），mxscale
  与 x 同 rank，量化轴维 = ceil(x.shape[axis]/blocksize)，其余维度与 x 一致
