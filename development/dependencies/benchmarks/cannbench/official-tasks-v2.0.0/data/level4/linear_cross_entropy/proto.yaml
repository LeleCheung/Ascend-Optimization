attrs:
- default: mean
  description: 损失聚合方式，支持 "mean"（按有效 token 数归一）或 "sum"
  name: reduction
  required: false
  type: str
- default: -100
  description: 忽略的标签值，labels 中等于该值的 token 不参与损失计算与 mean 归一
  name: ignore_index
  required: false
  type: int
category: FusedComposite
description: 融合 LM-head 投影与交叉熵损失算子，kernel 侧需分块在线 softmax、避免落盘 T×V logits
difficulty: L4
formula: 'logits = hidden @ weight^T                          # [T, H] x [V, H]^T
  -> [T, V]，fp32

  loss_t = -log_softmax(logits_t)[labels_t]           # 逐 token 交叉熵，labels_t == ignore_index
  的 token 跳过

  loss = mean(loss_t) 或 sum(loss_t)                  # 按 reduction 聚合（mean 按有效 token
  数归一）

  '
inputs:
- description: 最后一层 hidden states（LM-head 输入）
  dtype:
  - bfloat16
  - float16
  - float32
  name: hidden
  shape: '[T, H]'
- description: LM-head 投影权重（词表方向在前），logits = hidden @ weight^T
  dtype:
  - bfloat16
  - float16
  - float32
  name: weight
  shape: '[V, H]'
- description: 目标 token id，取值范围 [0, V-1]（或等于 ignore_index），评测用例 value_range 保证落在有效值域内
  dtype:
  - int32
  name: labels
  shape: '[T]'
name: LinearCrossEntropy
outputs:
- description: 聚合后的交叉熵损失，固定 float32
  dtype:
  - float32
  name: loss
  shape: '[1]'
schema: linear_cross_entropy(Tensor hidden, Tensor weight, Tensor labels, str reduction="mean",
  int ignore_index=-100) -> Tensor loss
shape_support: hidden [T, H]，weight [V, H]，labels [T]，输出 loss [1]
