attrs:
- description: 步长
  name: strides
  required: true
  type: ListInt
- description: 填充
  name: pads
  required: true
  type: ListInt
- default:
  - 1
  - 1
  description: 膨胀率
  name: dilations
  required: false
  type: ListInt
category: Contraction
description: 计算2D卷积
difficulty: L3
formula: y = CONV(x, filter) + bias
inputs:
- description: 输入特征图
  dtype:
  - float16
  - float32
  - bfloat16
  name: x
- description: 卷积核
  dtype:
  - float16
  - float32
  - bfloat16
  name: filter
- description: 偏置
  dtype:
  - float16
  - float32
  - bfloat16
  name: bias
name: Conv2D
outputs:
- description: 输出特征图
  dtype:
  - float16
  - float32
  - bfloat16
  name: y
schema: conv_2d(Tensor x, Tensor filter, Tensor bias, int[] strides, int[] pads, int[]
  dilations) -> Tensor y
shape_support: 'x: [N, C_in, H, W], filter: [C_out, C_in, K_h, K_w]'
