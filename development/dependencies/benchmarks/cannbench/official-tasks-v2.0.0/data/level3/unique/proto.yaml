attrs:
- default: false
  description: 是否返回逆索引，用于重建原始张量
  name: return_inverse
  required: false
  type: bool
category: SortSelect
description: 去除张量中的重复元素
difficulty: L3
formula: y, inverse = unique(x, return_inverse)
inputs:
- description: 输入张量
  dtype:
  - bfloat16
  - float16
  - float32
  - int8
  - int32
  - int64
  - uint8
  name: x
name: Unique
outputs:
- description: 输出张量，唯一值
  dtype:
  - bfloat16
  - float16
  - float32
  - int8
  - int32
  - int64
  - uint8
  name: y
- description: 逆索引，满足 x = y[inverse]
  dtype:
  - int64
  name: inverse
  optional: true
precision_thresholds:
  bfloat16: 0
  float16: 0
  float32: 0
  int32: 0
  int64: 0
  int8: 0
  uint8: 0
schema: unique(Tensor x, bool return_inverse) -> (Tensor y, Tensor inverse)
shape_support: 输入 ND 格式
