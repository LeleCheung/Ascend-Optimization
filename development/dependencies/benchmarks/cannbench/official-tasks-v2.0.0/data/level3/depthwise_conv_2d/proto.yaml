attrs:
- description: 卷积核大小
  name: kernelSize
  required: true
  type: ListInt
- description: 步长
  name: stride
  required: true
  type: ListInt
- description: 填充
  name: padding
  required: true
  type: ListInt
- description: 膨胀率
  name: dilation
  required: true
  type: ListInt
- description: 分组数；depthwise 要求 groups == C（输入通道数）
  name: groups
  required: true
  type: Int
category: Contraction
description: 二维深度卷积运算（每输入通道独立卷积，groups = C，无跨通道求和）
difficulty: L3
formula: y[n,c,h,w] = bias[c] + sum_{kh,kw} x[n,c,h*s_h+kh*d_h-p_h,w*s_w+kw*d_w-p_w]
  * weight[c,kh,kw]
inputs:
- description: 输入特征图
  dtype:
  - float16
  - float32
  - bfloat16
  name: x
- description: 卷积核
  dtype:
  - float16
  - float32
  - bfloat16
  name: weight
- description: 偏置
  dtype:
  - float16
  - float32
  - bfloat16
  name: bias
name: DepthwiseConv2D
outputs:
- description: 输出特征图
  dtype:
  - float16
  - float32
  - bfloat16
  name: y
schema: depthwise_conv_2d(Tensor x, Tensor weight, Tensor bias, int[] kernelSize,
  int[] stride, int[] padding, int[] dilation, int groups) -> Tensor y
shape_support: 'x: [N, C, H, W], weight: [C, K_h, K_w], bias: [C]; 约束 groups == C'
