attrs:
- description: 输出高度
  name: outputHeight
  required: true
  type: int
- description: 输出宽度
  name: outputWidth
  required: true
  type: int
- description: 空间缩放因子 (用于将 boxes 坐标映射到特征图尺度)
  name: spatial_scale
  required: true
  type: float
- default: -1
  description: 采样比率 (-1 或 0 表示自动计算)
  name: sampling_ratio
  required: false
  type: int
- default: false
  description: 是否对齐 (aligned=True 时 boxes 坐标偏移 -0.5 像素)
  name: aligned
  required: false
  type: bool
category: FusedComposite
description: 池化层，用于非均匀输入尺寸的特征图
difficulty: L3
formula: y = roi_align(x, boxes, output_size)
inputs:
- description: 输入特征图 [B, C, H, W]
  dtype:
  - float32
  - float16
  name: x
- description: ROI 框 [numBoxes, 5]，每行 (batch_idx, x0, y0, x1, y1)；col 0 为整数值的 batch
    索引（同 features dtype）
  dtype:
  - float32
  - float16
  name: boxes
name: ROIAlign
outputs:
- description: 输出张量 [numBoxes, C, outputHeight, outputWidth]，ROI 对齐结果
  dtype:
  - float32
  - float16
  name: y
precision_thresholds:
  float16: 0.1
  float32: 0.01
schema: roi_align(Tensor x, Tensor boxes, int outputHeight, int outputWidth, float
  spatial_scale, int sampling_ratio, bool aligned) -> Tensor y
shape_support: 'x: [B, C, H, W], boxes: [numBoxes, 5]'
