attrs:
- description: 滑动窗口的步长 [1, stride_h, stride_w, 1]，首尾固定为1
  name: strides
  required: true
  type: listInt
- description: 膨胀率 [1, rate_h, rate_w, 1]，首尾固定为1，用于空洞膨胀
  name: rates
  required: true
  type: listInt
- default: SAME
  description: 填充模式：'SAME' 或 'VALID'
  name: padding_mode
  required: false
  type: string
- default:
  - 0
  - 0
  - 0
  - 0
  description: 填充值 [pad_top, pad_bottom, pad_left, pad_right]
  name: pads
  required: false
  type: listInt
- default: false
  description: 是否向上取整计算输出尺寸
  name: ceil_mode
  required: false
  type: bool
- default: NHWC
  description: 数据格式，如 'NHWC'
  name: data_format
  required: false
  type: string
category: Contraction
description: 2D形态学膨胀操作，对每个位置在膨胀窗口内取 input + filter 的最大值
difficulty: L3
formula: y[b, y, x, c] = max_{dy,dx} (x[b, y*stride_h + rate_h*dy, x*stride_w + rate_w*dx,
  c] + filter[dy, dx, c])
inputs:
- description: 输入图像
  dtype:
  - float16
  name: x
- description: 结构元素/卷积核
  dtype:
  - float16
  name: filter
name: Dilation2D
outputs:
- description: 膨胀后的图像
  dtype:
  - float16
  name: y
schema: dilation_2d(Tensor x, Tensor filter, int[] strides, int[] rates, str padding_mode,
  int[] pads, bool ceil_mode, str data_format) -> Tensor y
shape_support: '输入shape: [batch, height, width, depth]，输出shape根据padding和stride决定'
