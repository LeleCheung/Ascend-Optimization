attrs:
- description: 步长
  name: strides
  required: true
  type: ListInt
- description: 填充，6元素格式 [D_front, D_back, H_top, H_bottom, W_left, W_right]
  name: pads
  required: true
  type: ListInt
- description: 膨胀率
  name: dilations
  required: true
  type: ListInt
- default: 1
  description: 分组数
  name: groups
  required: false
  type: Int
- description: filter的shape [C_out, C_in/groups, K_d, K_h, K_w]
  name: filter_size
  required: true
  type: ListInt
category: Contraction
description: Conv3D的filter梯度
difficulty: L3
formula: y = conv3d_filter_grad(x, grad, filter_size)
inputs:
- description: 输入特征图，shape为[N, C_in, D, H, W]
  dtype:
  - float16
  - bfloat16
  name: x
- description: 输出梯度，shape为[N, C_out, D_out, H_out, W_out]
  dtype:
  - float16
  - bfloat16
  name: grad
name: Conv3DBackpropFilter
outputs:
- description: filter梯度
  dtype:
  - float16
  - bfloat16
  name: y
schema: conv_3d_backprop_filter(Tensor x, Tensor grad, int[] strides, int[] pads,
  int[] dilations, int groups, int[] filter_size) -> Tensor y
shape_support: 'x: [N, C_in, D, H, W], grad: [N, C_out, D_out, H_out, W_out], filter_size:
  [C_out, C_in, K_d, K_h, K_w]'
