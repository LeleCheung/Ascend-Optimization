attrs:
- description: 输出特征 N
  name: out_features
  required: true
  type: int
- description: 输入特征 K
  name: in_features
  required: true
  type: int
- default: 32
  description: Q4_0 固定 block size，仅允许 32
  name: block_size
  required: false
  type: int
- default: q4_0
  description: 首版仅支持 q4_0
  name: quant_type
  required: false
  type: str
category: Contraction
description: 严格按照 GGUF Q4_0 block 格式完成权重反量化和矩阵乘
difficulty: L3
formula: y = x @ dequant_q4_0(qweight, scales).T
inputs:
- description: activation 输入
  dtype:
  - float16
  - bfloat16
  - float32
  name: x
  shape: '[..., K]'
- description: 按 [N, K/32, 16] 展平的 Q4_0 packed codes
  dtype:
  - uint8
  name: qweight
  shape: '[N*K/2]'
- description: 从 Q4_0 block 提取的 FP16 scale
  dtype:
  - float16
  name: scales
  shape: '[N, K/32]'
name: Q4_0DequantMatmul
outputs:
- description: matmul 输出
  dtype:
  - float16
  - bfloat16
  - float32
  name: y
  shape: '[..., N]'
schema: q4_0_dequant_matmul(Tensor x, Tensor qweight, Tensor scales, int out_features,
  int in_features, int block_size=32, str quant_type="q4_0") -> Tensor y
shape_support: 'x: [..., K], qweight: [N*K/2], scales: [N, K/32], K % 32 == 0'
