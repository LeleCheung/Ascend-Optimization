attrs:
- description: 每组 token 的累计行数（cumsum 语义），长度为 E，最后一个值等于 M；允许相邻值相等表示空组
  name: group_list
  required: true
  type: List[int]
- default: 0
  description: 输出切分模式，0/1=输出 List[Tensor] 长度 E（按 group_list 切回每组），2/3=输出单 tensor [M,
    N]
  name: split_item
  required: false
  type: int
- default: false
  description: 是否转置权重，false 时 weight 为 [E, K, N]（直接 matmul），true 时为 [E, N, K]（需在最后两维
    transpose 后 matmul）
  name: transpose_weight
  required: false
  type: bool
category: Contraction
description: 分组矩阵乘法算子，x 沿 M 轴合并为单 tensor，weight 按 expert 维堆叠为 [E, K, N]，通过 group_list（cumsum）切分每组在
  M 轴上的行
difficulty: L3
formula: "对每个专家 g ∈ [0, E):\n  rows_g = group_list 指定属于第 g 组的 token 行（cumsum 语义）\n\
  \  y[rows_g] = x[rows_g] @ weight[g] (+ bias[g])\n"
inputs:
- description: 激活矩阵（GMM 左矩阵），所有组沿 M 轴合并为单 tensor
  dtype:
  - float16
  - bfloat16
  - float32
  name: x
  shape: '[M, K]'
- description: 专家权重（GMM 右矩阵），按 expert 维堆叠；transpose_weight=false 时为 [E, K, N]，true
    时为 [E, N, K]
  dtype:
  - float16
  - bfloat16
  - float32
  name: weight
  shape: '[E, K, N] 或 [E, N, K]'
- description: 偏置（可选），按 expert 维堆叠
  dtype:
  - float16
  - bfloat16
  - float32
  name: bias
  optional: true
  shape: '[E, N]'
name: GroupedMatmul
outputs:
- description: 输出 tensor list，split_item=0/1 时长度 E（每组 [m_i, N]），split_item=2/3 时长度
    1（单 tensor [M, N]）
  dtype:
  - float16
  - bfloat16
  - float32
  name: y
  shape: List[Tensor]：split_item=0/1 时长度 E，每组 [m_i, N]；split_item=2/3 时长度 1，[M, N]
schema: grouped_matmul(Tensor x, Tensor weight, Tensor? bias, int[] group_list, int
  split_item=0, bool transpose_weight=False) -> Tensor[] y
shape_support: 'x: [M, K], weight: [E, K, N] (transpose_weight=false) 或 [E, N, K]
  (transpose_weight=true), bias: [E, N]; 输出 y: [M, N]'
