category: Transform
description: 将 decode 新生成的 K/V token 按 slot_mapping 写入分页 KV cache
difficulty: L3
formula: cache_out.reshape(-1,H,D)[slot_mapping] = new_token
inputs:
- description: 原 K cache
  dtype:
  - float16
  - bfloat16
  - float32
  name: k_cache
  shape: '[num_blocks, page_block_size, Hkv, D]'
- description: 原 V cache
  dtype:
  - float16
  - bfloat16
  - float32
  name: v_cache
  shape: '[num_blocks, page_block_size, Hkv, D]'
- description: 待写入 K token
  dtype:
  - float16
  - bfloat16
  - float32
  name: new_k
  shape: '[T, Hkv, D]'
- description: 待写入 V token
  dtype:
  - float16
  - bfloat16
  - float32
  name: new_v
  shape: '[T, Hkv, D]'
- description: 线性 cache slot
  dtype:
  - int32
  - int64
  name: slot_mapping
  shape: '[T]'
name: KvCacheAppend
outputs:
- description: 写入后的 K cache
  dtype:
  - float16
  - bfloat16
  - float32
  name: k_cache_out
  shape: '[num_blocks, page_block_size, Hkv, D]'
- description: 写入后的 V cache
  dtype:
  - float16
  - bfloat16
  - float32
  name: v_cache_out
  shape: '[num_blocks, page_block_size, Hkv, D]'
schema: kv_cache_append(Tensor k_cache, Tensor v_cache, Tensor new_k, Tensor new_v,
  Tensor slot_mapping) -> (Tensor k_cache_out, Tensor v_cache_out)
shape_support: 'cache: [Blocks,Page,Hkv,D], new_k/new_v: [T,Hkv,D], slot_mapping:
  [T]'
