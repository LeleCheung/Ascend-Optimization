attrs:
- description: '返回的topk数量 (取值范围: 1 <= k <= dim_size)'
  name: k
  required: true
  type: int64
- description: '排序维度 (取值范围: -ndim ~ ndim-1)'
  name: dim
  required: true
  type: int64
- default: true
  description: 是否返回最大值 (false时返回最小值)
  name: largest
  required: false
  type: bool
category: SortSelect
description: 返回k个最大或最小的元素及其索引
difficulty: L3
formula: y, idx = topk(x, k, dim)
inputs:
- description: 输入张量
  dtype:
  - int8
  - uint8
  - int32
  - int64
  - float16
  - float32
  - bfloat16
  name: x
name: TopK
outputs:
- description: 输出张量，topk值
  dtype:
  - int8
  - uint8
  - int32
  - int64
  - float16
  - float32
  - bfloat16
  name: y
- compare: false
  description: 输出索引张量，始终为 int64 类型
  dtype:
  - int64
  index_gather:
    dim_attr: dim
    distinct: true
    input: x
    value_output: y
  name: idx
schema: top_k(Tensor x, int k, int dim, bool largest) -> (Tensor y, Tensor idx)
shape_support: 输入1-8维
