attrs:
- default: 1
  description: topK数量，要求0<k<=x最后一维大小，且k<=1024
  name: k
  type: int
category: LayoutTransform
description: MoE门控网络中Softmax和TopK的融合，输出topK值、专家索引和行位置索引
difficulty: L3
formula: 'softmaxOut = softmax(x, axis=-1)

  yOut, expertIdxOut = topK(softmaxOut, k)

  rowIdxRange = arange(expertIdxOut.shape[0] * expertIdxOut.shape[1])

  rowIdxOut = rowIdxRange.reshape([expertIdxOut.shape[1], expertIdxOut.shape[0]]).transpose(1,
  0)

  '
inputs:
- description: 输入张量，shape为(..., E)，E为专家数
  dtype:
  - float16
  - bfloat16
  - float32
  name: x
  shape: 2D或3D
- description: 可选输入，标记哪些行参与计算，shape为x_shape[:-1]
  dtype:
  - bool
  name: finished
  optional: true
  shape: x_shape[:-1]
name: MoeGatingTopKSoftmax
outputs:
- description: topK结果值，shape为(..., k)
  dtype:
  - float16
  - bfloat16
  - float32
  name: y
  shape: (..., k)
- compare: false
  description: topK对应的专家索引，shape为(..., k)。
  dtype:
  - int32
  index_gather:
    dim: -1
    finished_input: finished
    input: x
    k_attr: k
    value_topk: true
    value_transform: softmax
  name: expert_idx
  shape: (..., k)
- compare: true
  description: 行位置索引，shape为(..., k)。
  dtype:
  - int32
  name: row_idx
  shape: (..., k)
schema: moe_gating_top_k_softmax(Tensor x, Tensor? finished=None, int k=1) -> (Tensor
  y, Tensor expert_idx, Tensor row_idx)
shape_support: 'x: 2D或3D; finished: x_shape[:-1]; outputs: (..., k)'
