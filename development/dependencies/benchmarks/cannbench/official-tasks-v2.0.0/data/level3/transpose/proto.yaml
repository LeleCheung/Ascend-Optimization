attrs:
- description: 维度置换顺序
  name: perm
  type: int[]
category: LayoutTransform
description: 对tensor的任意维度进行调换
difficulty: L3
formula: y[i0,...,in-1] = x[i_perm[0],...,i_perm[n-1]]
inputs:
- description: 输入张量
  dtype:
  - float16
  - float32
  - bfloat16
  - int8
  - int16
  - int32
  - int64
  name: x
name: Transpose
outputs:
- description: 输出张量，转置后的结果
  dtype:
  - float16
  - float32
  - bfloat16
  - int8
  - int16
  - int32
  - int64
  name: y
schema: transpose(Tensor x, int[] perm) -> Tensor y
shape_support: 输入维度<=8维
