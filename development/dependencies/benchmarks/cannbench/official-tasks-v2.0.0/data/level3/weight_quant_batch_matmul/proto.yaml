attrs: null
category: Contraction
description: 权重量化批量矩阵乘法算子，支持权重的反量化计算
difficulty: L3
formula: y = x @ ANTIQUANT(weight) + bias, ANTIQUANT(weight) = (weight + antiquantOffset)
  * antiquantScale
inputs:
- description: 左输入矩阵，shape 为 [M, K]
  dtype:
  - float16
  - bfloat16
  name: x
- description: 右输入矩阵（量化权重），shape 为 [K, N]
  dtype:
  - int8
  name: weight
- description: 反量化scale参数，shape 为 [N] 或 [1, N]
  dtype:
  - float16
  - bfloat16
  name: antiquantScale
- description: 反量化offset参数（可选），shape 与 antiquantScale 相同
  dtype:
  - float16
  - bfloat16
  name: antiquantOffset
  optional: true
- description: 偏置张量（可选），shape 为 [N] 或 [1, N]；x=float16 时为 float16，x=bfloat16 时为 float32
  dtype:
  - float16
  - float32
  name: bias
  optional: true
name: WeightQuantBatchMatmul
outputs:
- description: 输出张量，shape 为 [M, N]
  dtype:
  - float16
  - bfloat16
  name: y
schema: weight_quant_batch_matmul(Tensor x, Tensor weight, Tensor antiquantScale,
  Tensor? antiquantOffset=None, Tensor? bias=None) -> Tensor y
shape_support: 'x: [M, K], weight: [K, N], antiquantScale: [N], y: [M, N]'
