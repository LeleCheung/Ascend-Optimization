attrs:
- default: -1.0
  description: 指数底数，-1.0表示使用自然底数e，正值表示自定义底数
  name: base
  type: float
- default: 1.0
  description: 输入缩放因子
  name: scale
  type: float
- default: 0.0
  description: 输入偏移量
  name: shift
  type: float
category: Elementwise
description: 计算输入张量的指数函数，支持自定义底数、缩放和偏移
difficulty: L1
formula: y = e^((x * scale + shift) * ln(base))
inputs:
- description: 输入张量
  dtype:
  - float16
  - float32
  - bfloat16
  name: x
name: Exp
note: 当base=-1时，公式简化为 y = e^(x * scale + shift)
outputs:
- description: 指数计算结果，输出数据类型与输入一致
  dtype:
  - float16
  - float32
  - bfloat16
  name: y
schema: exp(Tensor x, float base=-1.0, float scale=1.0, float shift=0.0) -> Tensor
  y
shape_support: 输入任意维度，输出与输入相同shape
