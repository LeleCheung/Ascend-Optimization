attrs:
- default: 0
  description: 本次首个query的零基绝对token位置
  name: query_start
  type: int
- default: -1.0
  description: <=0自动1/sqrt(D)；>0显式缩放；基准扩展属性
  name: scaleValue
  type: float
category: FusedComposite
description: V4 CSA核心子图：压缩KV稀疏条目与128滑窗条目共用带sink的softmax；不含压缩器或索引搜索。
difficulty: L5
formula: t=query_start+i; E=raw[max(0,t-127):t+1] concatenated with selected completed
  compressed blocks; z=scale*Q@E^T; y=sum(exp(z)*E)/(sum(exp(z))+exp(attn_sink))
inputs:
- description: 已完成投影和位置处理的query
  dtype:
  - float16
  - bfloat16
  - float32
  name: query
  shape: '[B,S,H,D]'
- description: 已压缩且已完成位置处理的共享K=V；C=floor((query_start+S)/4)
  dtype:
  - float16
  - bfloat16
  - float32
  name: compressed_kv
  shape: '[B,C,D]'
- description: 时间连续的共享K=V原始缓存；起点max(0,query_start-127)
  dtype:
  - float16
  - bfloat16
  - float32
  name: window_kv
  shape: '[B,Lw,D]'
- description: 每行有效压缩块id唯一且已完成；-1为padding
  dtype:
  - int32
  name: compressed_indices
  shape: '[B,S,K]'
- description: 各头sink logit；仅进入softmax分母
  dtype:
  - float32
  name: attn_sink
  shape: '[H]'
name: CompressedSparseAttentionCore
outputs:
- description: 逆RoPE/输出投影之前的核心输出；dtype同query
  dtype:
  - float16
  - bfloat16
  - float32
  name: y
  shape: '[B,S,H,D]'
schema: compressed_sparse_attention_core(Tensor query, Tensor compressed_kv, Tensor
  window_kv, Tensor compressed_indices, Tensor attn_sink, int query_start=0, float
  scaleValue=-1.0) -> Tensor y
shape_support: query:[B,S,H,D]; compressed_kv:[B,floor((query_start+S)/4),D]; window_kv:[B,S+min(query_start,127),D];
  indices:[B,S,K]; sink:[H]
