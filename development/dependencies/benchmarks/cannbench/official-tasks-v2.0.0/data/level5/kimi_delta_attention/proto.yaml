attrs:
- default: true
  description: 是否在核心中对Q/K按sum(x²)+1e-6归一化
  name: use_qk_l2norm
  type: bool
- default: -1.0
  description: <=0自动1/sqrt(Dk)；>0使用显式值；仅缩放读取输出
  name: scaleValue
  type: float
category: FusedComposite
description: Kimi Delta Attention的门控状态递推核心；可选QK归一化；输出序列及最终状态。
difficulty: L5
formula: Q,K optionally x/sqrt(sum(x*x)+1e-6); A=diag(exp(g_t)); Hbar=A@Hprev; r=v_t-k_t^T@Hbar;
  H=Hbar+beta_t*k_t@r^T; y_t=scale*q_t^T@H
inputs:
- description: 未归一化或按属性直接使用的查询
  dtype:
  - float16
  - bfloat16
  - float32
  name: q
  shape: '[B,T,H,Dk]'
- description: 键；归一化属于被测计算
  dtype:
  - float16
  - bfloat16
  - float32
  name: k
  shape: '[B,T,H,Dk]'
- description: 值
  dtype:
  - float16
  - bfloat16
  - float32
  name: v
  shape: '[B,T,H,Dv]'
- description: 逐token逐key通道自然对数衰减；不是累计gate
  dtype:
  - float32
  name: g
  shape: '[B,T,H,Dk]'
- description: 直接给定写入强度[0,1]；不再sigmoid
  dtype:
  - float32
  name: beta
  shape: '[B,T,H]'
- description: 必选初态；无历史时传零张量；不可原地修改
  dtype:
  - float32
  name: initial_state
  shape: '[B,H,Dk,Dv]'
name: KimiDeltaAttention
outputs:
- description: dtype与q一致
  dtype:
  - float16
  - bfloat16
  - float32
  name: y
  shape: '[B,T,H,Dv]'
- description: 末态；必须参与精度比较
  dtype:
  - float32
  name: final_state
  shape: '[B,H,Dk,Dv]'
schema: kimi_delta_attention(Tensor q, Tensor k, Tensor v, Tensor g, Tensor beta,
  Tensor initial_state, bool use_qk_l2norm=True, float scaleValue=-1.0) -> (Tensor
  y, Tensor final_state)
shape_support: q,k,g:[B,T,H,Dk]; v:[B,T,H,Dv]; beta:[B,T,H]; state:[B,H,Dk,Dv]; equal
  Q/K/V head counts
