attrs:
- description: 计算累积最小值的轴
  name: dim
  required: true
  type: int64
category: Reduction
description: 计算输入张量中的累积最小值
difficulty: L2
formula: y[i] = min(x[0], x[1], ..., x[i]) 沿指定轴
inputs:
- description: 输入张量
  dtype:
  - float16
  - float32
  - int32
  - bfloat16
  name: input
name: Cummin
outputs:
- description: 累积最小值张量，shape 与 input 相同，dtype 与 input 相同
  dtype:
  - float16
  - float32
  - int32
  - bfloat16
  name: values
- compare: false
  description: 累积最小值对应的索引张量，shape 与 input 相同，dtype 为 int64
  dtype:
  - int64
  index_gather:
    dim_attr: dim
    input: input
    value_output: values
  name: indices
schema: cummin(Tensor input, int dim) -> (Tensor values, Tensor indices)
shape_support: 输入输出shape相同
