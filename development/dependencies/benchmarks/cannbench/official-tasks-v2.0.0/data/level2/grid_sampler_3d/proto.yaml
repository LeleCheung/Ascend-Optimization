attrs:
- default: bilinear
  description: '插值模式 (''bilinear'': 三线性 (5D 输入下 PyTorch 的 ''bilinear'' 实际即 trilinear)，''nearest'':
    最近邻)。不支持 ''bicubic''（PyTorch 5D grid_sample 限制）'
  name: interpolation_mode
  required: false
  type: string
- default: zeros
  description: '填充模式 (''zeros'': 零填充，''border'': 边界填充，''reflection'': 反射填充)'
  name: padding_mode
  required: false
  type: string
- default: false
  description: 是否对齐角点
  name: align_corners
  required: false
  type: BOOL
category: FusedComposite
description: 根据 grid 中坐标信息填充输出
difficulty: L2
formula: y = grid_sample(x, grid)
inputs:
- description: 输入张量
  dtype:
  - float16
  - float32
  name: x
- description: 采样网格，形状为 (N, D, H, W, 3)
  dtype:
  - float16
  - float32
  name: grid
name: GridSampler3D
outputs:
- description: 输出张量，采样结果
  dtype:
  - float16
  - float32
  name: y
schema: grid_sampler_3d(Tensor x, Tensor grid, str interpolation_mode="bilinear",
  str padding_mode="zeros", bool align_corners=false) -> Tensor y
shape_support: 输入 5D (N, C, D, H, W)
