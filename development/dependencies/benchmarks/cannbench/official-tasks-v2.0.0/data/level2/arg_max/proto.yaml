attrs:
- description: 计算 argmax 的维度
  name: dim
  required: true
  type: int64
- default: false
  description: 是否保留约简维度
  name: keepdim
  required: false
  type: bool
category: SortSelect
description: 返回张量在指定维度上的最大值的索引
difficulty: L2
formula: indices = argmax(input, dim=dim)
inputs:
- description: 输入张量
  dtype:
  - float16
  - float32
  - bfloat16
  - int32
  - int64
  name: input
name: ArgMax
outputs:
- compare: false
  description: 最大值的索引张量，dtype 固定 int64
  dtype:
  - int64
  index_gather:
    dim_attr: dim
    input: input
    keepdim_attr: keepdim
    value_reduce: amax
  name: indices
schema: arg_max(Tensor input, int dim, bool keepdim=false) -> Tensor indices
shape_support: 输入支持 0-8 维
