attrs:
- default: 0
  description: '输入布局 (0: [B,S,N,D], 1: [B,N,S,D])'
  name: layout
  required: false
  type: int
- default: half
  description: '旋转模式 ("half": 连续半分式，"interleaved": 交错式)'
  name: rotaryMode
  required: false
  type: string
category: FusedComposite
description: 对 query 和 key 执行旋转位置编码 (RoPE) 计算
difficulty: L2
formula: 'rotate_half(x) = concat(-x[head_dim/2:], x[:head_dim/2])

  y = (x * cos) + (rotate_half(x) * sin)

  '
inputs:
- description: 查询张量
  dtype:
  - float32
  - float16
  - bfloat16
  name: query
- description: 键张量
  dtype:
  - float32
  - float16
  - bfloat16
  name: key
- description: 余弦位置编码
  dtype:
  - float32
  - float16
  - bfloat16
  name: cos
- description: 正弦位置编码
  dtype:
  - float32
  - float16
  - bfloat16
  name: sin
name: ApplyRotaryPosEmb
outputs:
- description: 旋转后的查询张量
  dtype:
  - float32
  - float16
  - bfloat16
  name: query_out
- description: 旋转后的键张量
  dtype:
  - float32
  - float16
  - bfloat16
  name: key_out
precision_thresholds:
  bfloat16: 0.01
  float16: 0.01
  float32: 0.005
schema: apply_rotary_pos_emb(Tensor query, Tensor key, Tensor cos, Tensor sin, int
  layout=0, str rotaryMode="half") -> (Tensor query_out, Tensor key_out)
shape_support: 'query: (batch_size, seq_len, num_heads, head_dim) 或 (batch_size, num_heads,
  seq_len, head_dim)

  key: 同 query

  cos: (seq_len, head_dim/2) 或 (batch_size, seq_len, head_dim/2)

  sin: (seq_len, head_dim/2) 或 (batch_size, seq_len, head_dim/2)

  '
