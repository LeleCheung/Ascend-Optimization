attrs:
- default: mean
  description: 损失聚合方式 ('none' | 'mean' | 'sum')
  name: reduction
  required: false
  type: string
- default: -100
  description: 忽略的标签索引（不影响损失计算）
  name: ignore_index
  required: false
  type: int
category: NumericalStable
description: 计算交叉熵损失，用于分类任务
difficulty: L2
formula: 'L = -log(exp(x[target]) / sum(exp(x)))

  或带 weight: L = -weight[target] * log(exp(x[target]) / sum(exp(x)))

  '
inputs:
- description: 输入 logits 张量（未经 softmax）
  dtype:
  - float32
  - float16
  - bfloat16
  name: input
- description: 目标标签索引（hard labels）或概率分布（soft labels）
  dtype:
  - int32
  - int64
  - float32
  - float16
  - bfloat16
  name: target
name: CrossEntropyLoss
outputs:
- description: 损失值（reduction='none' 时 shape 为 (N,)，否则为标量）
  dtype:
  - float32
  - float16
  - bfloat16
  name: loss
schema: cross_entropy_loss(Tensor input, Tensor target, str reduction="mean", int
  ignore_index=-100) -> Tensor loss
shape_support: 'input: (N, C) 或 (N, C, d1, d2, ...) - channel_first 约定，C 为类别维度

  target: (N,) 或 (N, d1, d2, ...) 硬标签，或 (N, C) 软标签

  '
