attrs:
- default: 224
  description: 输出高度
  name: out_h
  required: false
  type: int
- default: 224
  description: 输出宽度
  name: out_w
  required: false
  type: int
- default: false
  description: 双线性插值是否对齐角点
  name: align_corners
  required: false
  type: bool
category: FusedComposite
description: 将 NCHW 图像张量双线性 resize 到固定尺寸后按 channel 做 normalize
difficulty: L2
formula: y = (resize_bilinear(x, [out_h, out_w]) - mean) / std
inputs:
- description: 输入图像张量
  dtype:
  - float16
  - bfloat16
  - float32
  name: x
  shape: '[B,C,H,W]'
- description: channel mean
  dtype:
  - float16
  - bfloat16
  - float32
  name: mean
  shape: '[C]'
- description: channel std
  dtype:
  - float16
  - bfloat16
  - float32
  name: std
  shape: '[C]'
name: ImageResizeNormalize
outputs:
- description: resize + normalize 输出
  dtype:
  - float16
  - bfloat16
  - float32
  name: y
  shape: '[B,C,out_h,out_w]'
schema: image_resize_normalize(Tensor x, Tensor mean, Tensor std, int out_h=224, int
  out_w=224, bool align_corners=False) -> Tensor y
shape_support: 'x: [B,C,H,W], mean/std: [C], y: [B,C,out_h,out_w]'
