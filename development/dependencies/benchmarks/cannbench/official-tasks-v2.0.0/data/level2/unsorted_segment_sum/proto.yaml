attrs:
- description: 段数量
  name: num_segments
  required: true
  type: INT
category: ScatterUpdate
description: 沿segment_ids指定的段对数据进行求和
difficulty: L2
formula: y[i] = sum(data[j]) where segment_ids[j] == i
inputs:
- description: 输入数据张量
  dtype:
  - float16
  - bfloat16
  - float32
  - int32
  - int64
  name: data
- description: 段ID张量
  dtype:
  - int32
  - int64
  name: segment_ids
name: UnsortedSegmentSum
outputs:
- description: 输出张量，段求和结果
  dtype:
  - float16
  - bfloat16
  - float32
  - int32
  - int64
  name: y
precision_thresholds:
  float32: 0.001
schema: unsorted_segment_sum(Tensor data, Tensor segment_ids, int num_segments) ->
  Tensor y
shape_support: 输入ND格式
