<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="970" viewBox="0 0 1700 970"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596170"/></marker></defs><rect width="1700" height="970" fill="#fff7e8"/><g font-family="Microsoft YaHei, sans-serif" fill="#1b2434"><text x="55" y="65" font-size="42" fill="#1b2434" font-weight="600">持续模拟器重放：依据热点与等待选择修改层</text><text x="58" y="110" font-size="27" fill="#596170" font-weight="400">四项源码层案例已验证；另有 4 项固定源码的 IR 收益完成验收</text><rect x="60" y="150" width="480" height="110" rx="16" fill="#fffaf0" stroke="#2368b1" stroke-width="2"/><text x="82" y="191" font-size="30" fill="#2368b1" font-weight="600">成对真机 Profiling</text><text x="82" y="230" font-size="23" fill="#1b2434" font-weight="400">定位 kernel、流水与输入差距</text><rect x="610" y="150" width="480" height="110" rx="16" fill="#fffaf0" stroke="#c55a18" stroke-width="2"/><text x="632" y="191" font-size="30" fill="#c55a18" font-weight="600">继续模拟器重放</text><text x="632" y="230" font-size="23" fill="#1b2434" font-weight="400">当前二进制：热点、流水与等待</text><rect x="1160" y="150" width="480" height="110" rx="16" fill="#fffaf0" stroke="#2368b1" stroke-width="2"/><text x="1182" y="191" font-size="30" fill="#2368b1" font-weight="600">关联源码与实际 IR</text><text x="1182" y="230" font-size="23" fill="#1b2434" font-weight="400">绑定源码、case、编译配置与产物</text><path d="M850 267L850 300" fill="none" stroke="#596170" stroke-width="3" marker-end="url(#arrow)"/><text x="425" y="337" font-size="29" fill="#1b2434" font-weight="600">机制假设 → 判断表达能力与编译结果 → 选择路线</text><text x="65" y="395" font-size="31" fill="#168358" font-weight="600">编译优化线</text><text x="305" y="395" font-size="25" fill="#596170" font-weight="400">分块、布局、访存、融合、同步；依据缺陷选择具体修改层</text><rect x="60" y="420" width="480" height="135" rx="16" fill="#fffaf0" stroke="#168358" stroke-width="2"/><text x="82" y="461" font-size="30" fill="#168358" font-weight="600">Triton 源码</text><text x="82" y="500" font-size="23" fill="#1b2434" font-weight="400">已有语言和编译链可表达的改法</text><text x="82" y="535" font-size="22" fill="#168358" font-weight="400">当前：四项完整验证案例</text><rect x="610" y="420" width="480" height="135" rx="16" fill="#fffaf0" stroke="#c55a18" stroke-width="2"/><text x="632" y="461" font-size="30" fill="#c55a18" font-weight="600">单算子 IR</text><text x="632" y="500" font-size="23" fill="#1b2434" font-weight="400">固定源码，修改后编译并继续重放</text><text x="632" y="535" font-size="22" fill="#c55a18" font-weight="400">当前：4 项完整验收IR收益</text><rect x="1160" y="420" width="480" height="135" rx="16" fill="#fffaf0" stroke="#596170" stroke-width="2"/><text x="1182" y="461" font-size="30" fill="#596170" font-weight="600">通用编译 pass</text><text x="1182" y="500" font-size="23" fill="#1b2434" font-weight="400">多个算子反复出现共同缺陷</text><text x="1182" y="535" font-size="22" fill="#596170" font-weight="400">后续：验证适用范围与回归</text><path d="M548 485L600 485" fill="none" stroke="#596170" stroke-width="3" marker-end="url(#arrow)"/><path d="M1098 485L1150 485" fill="none" stroke="#596170" stroke-width="3" marker-end="url(#arrow)"/><text x="100" y="588" font-size="24" fill="#c55a18" font-weight="400">各层共用重放闭环：新产物 → 重放热点／等待 → 真机验收 → 保留最佳 → 下一轮</text><text x="65" y="620" font-size="31" fill="#2368b1" font-weight="600">能力扩展线</text><text x="305" y="620" font-size="25" fill="#596170" font-weight="400">先确认现有 Triton 及编译 pass 的表达边界，再选择扩展入口</text><rect x="60" y="645" width="480" height="135" rx="16" fill="#fffaf0" stroke="#2368b1" stroke-width="2"/><text x="82" y="686" font-size="30" fill="#2368b1" font-weight="600">Triton kernel</text><text x="82" y="725" font-size="23" fill="#1b2434" font-weight="400">定位具体缺失的硬件操作</text><text x="82" y="760" font-size="22" fill="#2368b1" font-weight="400">入口：先核对现有 builtin／pass</text><rect x="610" y="645" width="480" height="135" rx="16" fill="#fffaf0" stroke="#596170" stroke-width="2"/><text x="632" y="686" font-size="30" fill="#596170" font-weight="600">custom op</text><text x="632" y="725" font-size="23" fill="#1b2434" font-weight="400">建立独立、可追溯的调用边界</text><text x="632" y="760" font-size="22" fill="#596170" font-weight="400">条件：确认现有表达能力缺口</text><rect x="1160" y="645" width="480" height="135" rx="16" fill="#fffaf0" stroke="#596170" stroke-width="2"/><text x="1182" y="686" font-size="30" fill="#596170" font-weight="600">Ascend C</text><text x="1182" y="725" font-size="23" fill="#1b2434" font-weight="400">实现底层指令或特殊流水能力</text><text x="1182" y="760" font-size="22" fill="#596170" font-weight="400">结果：单列能力扩展研究</text><path d="M548 710L600 710" fill="none" stroke="#596170" stroke-width="3" marker-end="url(#arrow)"/><path d="M1098 710L1150 710" fill="none" stroke="#596170" stroke-width="3" marker-end="url(#arrow)"/><path d="M850 788L850 826" fill="none" stroke="#596170" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="840" width="1580" height="98" rx="16" fill="#e8f2e8" stroke="#168358" stroke-width="2"/><text x="85" y="881" font-size="29" fill="#168358" font-weight="600">两条路线共同验证</text><text x="390" y="881" font-size="25" fill="#1b2434" font-weight="400">修改后重放 + 完整正确性／专项检查 + 真机性能与 Profiling → 保留最佳</text><text x="85" y="918" font-size="23" fill="#596170" font-weight="400">按日志保留重放与评测顺序、窗口及哈希；结果回到上方重放入口，能力扩展成果单列</text><path d="M1640 889H1675V130H850V142" fill="none" stroke="#c55a18" stroke-width="3" marker-end="url(#arrow)"/></g></svg>