 this is an interface defect that must be repaired before any performance claim.&quot;, &quot;source_sha256&quot;: &quot;7e467ac94eb533c7217cbfe95029f45b3ac3ef296a331641138938607a7635bd&quot;}, {&quot;reference&quot;: {&quot;path&quot;: &quot;trace/evidence/3424dad43c7c22df7cd7390d5e1b1ed96d3d465eff70caca767f1bc38e733743.json&quot;, &quot;sha256&quot;: &quot;3424dad43c7c22df7cd7390d5e1b1ed96d3d465eff70caca767f1bc38e733743&quot;}, &quot;original&quot;: {&quot;path&quot;: &quot;workspace/current-profiling.json&quot;, &quot;sha256&quot;: &quot;3424dad43c7c22df7cd7390d5e1b1ed96d3d465eff70caca767f1bc38e733743&quot;}, &quot;category&quot;: &quot;paired_profiling&quot;, &quot;role&quot;: &quot;trigger&quot;, &quot;finding&quot;: &quot;Target case timing-1 (fp16 4x32x128x128 -&gt; 256x256): candidate exact2x kernel Task Duration 70235 us, Block Dim 16384 programs, while reference task latency is 0.246 ms. Per-block mean aiv_time is 171.2 us vs 51.6 us reference; aiv_scalar_time is 123.2 us vs 7.26 us (scalar_ratio 0.72), aiv_mte3_time 37.4 us vs 8.0 us, aiv_mte2_time 15.7 vs 11.1. So the tiny 16384-program kernel is dominated by scalar address handling and store/sync per block, not by useful vector work (aiv_vec_time 20.9 us).&quot;, &quot;source_sha256&quot;: &quot;7e467ac94eb533c7217cbfe95029f45b3ac3ef296a331641138938607a7635bd&quot;}, {&quot;reference&quot;: {&quot;path&quot;: &quot;trace/evidence/b792a1076e237106d8b894263f0e9cd7095aa4ce89c5b4242aacfad7a2ded58b.json&quot;, &quot;sha256&quot;: &quot;b792a1076e237106d8b894263f0e9cd7095aa4ce89c5b4242aacfad7a2ded58b&quot;}, &quot;original&quot;: {&quot;path&quot;: &quot;workspace/simulator-evidence.json&quot;, &quot;sha256&quot;: &quot;b792a1076e237106d8b894263f0e9cd7095aa4ce89c5b4242aacfad7a2ded58b&quot;}, &quot;category&quot;: &quot;simulator&quot;, &quot;role&quot;: &quot;disambiguation&quot;, &quot;finding&quot;: &quot;Bound trace of upsample_bilinear2d_2x_kernel on core0.veccore0 for the same case: the source_function region has 435 instructions and 33.3 us trace-interval union; the largest items are BAR/WAIT_FLAG at the four stride-2 tl.store lines (246-249) and BARs after the vector blend lines 235-238 (about 10-17 us each, overlapping). It distinguishes the explanation &#x27;input DMA bandwidth bound&#x27; from &#x27;per-block store/sync plus scalar address work dominates&#x27;; it does not give an absolute critical path (capture is a partial window, application did not finish).&quot;, &quot;source_sha256&quot;: &quot;7e467ac94eb533c7217cbfe95029f45b3ac3ef296a331641138938607a7635bd&quot;}, {&quot;reference&quot;: {&quot;path&quot;: &quot;trace/evidence/c0dfc3760a0e0cef14585ee57e2b247e556e2e25bcac8e87ded947059d9b8d8b.ttir&quot;, &quot;sha256&quot;: &quot;c0dfc3760a0e0cef14585ee57e2b247e556e2e25bcac8e87ded947059d9b8d8b&quot;}, &quot;original&quot;: {&quot;path&quot;: &quot;workspace/current-ir/7e467ac94eb5/20-kernel.ttir&quot;, &quot;sha256&quot;: &quot;c0dfc3760a0e0cef14585ee57e2b247e556e2e25bcac8e87ded947059d9b8d8b&quot;}, &quot;category&quot;: &quot;source_ir&quot;, &quot;role&quot;: &quot;mechanism&quot;, &quot;finding&quot;: &quot;Exact2x TTIR shows 4 tt.store with per-lane offsets col_e_47 = 2*j (stride-2 scatter writes) and 9 tt.load whose offsets are max(j-1,0)/min(j+1,IW-1) results (non-affine clamped vectors). These force per-lane address generation instead of one bulk contiguous DMA per row, which matches the scalar-heavy, store-heavy per-block profile.&quot;, &quot;source_sha256&quot;: null}, {&quot;reference&quot;: {&quot;path&quot;: &quot;trace/evidence/0f710b1a0347827a328dffe43184bbed97b2b027a5bfc099d140b06e9da369ae.ttir&quot;, &quot;sha256&quot;: &quot;0f710b1a0347827a328dffe43184bbed97b2b027a5bfc099d140b06e9da369ae&quot;}, &quot;original&quot;: {&quot;path&quot;: &quot;workspace/actual-ir/upsample_bilinear2d_kernel.ttir&quot;, &quot;sha256&quot;: &quot;0f710b1a0347827a328dffe43184bbed97b2b027a5bfc099d140b06e9da369ae&quot;}, &quot;category&quot;: &quot;source_ir&quot;, &quot;role&quot;: &quot;background&quot;, &quot;finding&quot;: &quot;Original native starter (source 62a02c20) IR, bound to the historical source only; it is not evidence about the current candidate and is used solely as background for the native reference character.&quot;, &quot;source_sha256&quot;: null}, {&quot;reference&quot;: {&quot;path&quot;: &quot;trace/evidence/d1480e8698be45f420275cc8a8304fab15f1141326e78e3fda37b4af14981a9a.json&quot;, &quot;sha256&quot;: &quot;d1480e8698be45f420275cc8a8304fab15f1141326e78e3fda37b4af14981a9a&quot;}, &quot;original&quot;: {&quot;path&quot;: &quot;workspace/profiling-comparison.json&quot;, &quot;sha256&quot;: &quot;d1480e8698be45f420275cc8a8304fab15f1141326e78e3fda37b4af14981a9a&quot;}, &quot;category&quot;: &quot;paired_profiling&quot;, &quot;role&quot;: &quot;background&quot;, &quot;finding&quot;: &quot;Historical original-source paired collection (source 62a02c20) for the same case; not the current candidate and not a current speedup measurement.&quot;, &quot;source_sha256&quot;: &quot;62a02c203a3e54a09f6479ca8526168bf1529821284cd1b42bc6cbdf3c980a12&quot;}], &quot;hypothesis&quot;: &quot;For the exact-2x path the kernel currently issues 9 clamped (non-affine) gather loads and 4 stride-2 scatter stores per 128-lane block, so the Ascend backend must compute addresses per lane and serialize the stores; per-block cost is dominated by scalar address handling and store/sync (aiv_scalar_time 123 us, mte3 37 us per block). Making every access affine and contiguous (edge handling moved from address clamping to masks plus vector selects, and the two interleaved output columns written as one contiguous 2*BLOCK_J store via tl.interleave) should let MTE2/MTE3 emit bulk DMA and collapse the scalar and store time.&quot;, &quot;change&quot;: &quot;Compatibility edit (recorded separately from performance): rename the public operator function upsample_bilinear2d to a private name and have run() call it, so the loader no longer sees a conflicting public symbol. Performance change: in upsample_bilinear2d_2x_kernel replace the clamped gather loads (max(j-1,0), min(j+1,IW-1)) with affine j-1 / j / j+1 offsets guarded by load masks and fixed up with tl.where on the constant edge lanes, and replace the four stride-2 stores with two contiguous stores of tl.interleave(even, odd) over 2*BLOCK_J lanes (masked only on the tail path). Arithmetic and weights are unchanged.&quot;, &quot;expected&quot;: &quot;The module imports and binds under KGS (no BuildError). For timing-1, candidate task duration drops from ~70 ms by a large factor (target order of magnitude: a few ms or less), per-block aiv_scalar_time and aiv_mte3_time fall sharply, and aiv_vec_time stays approximately the same.&quot;, &quot;validation&quot;: &quot;Run the supplied preflight (structural checks and 30 supplementary cases); then the host&#x27;s full 24-case formal correctness + timing evaluation and a fresh paired profiling of the current SHA to compare scalar/mte3 per-block metrics and total task duration.&quot;, &quot;alternatives&quot;: [&quot;The cost is fixed per-program launch overhead of 16384 tiny programs rather than access shape; then contiguity alone would leave latency high and a row-tiled / larger-program design is needed.&quot;, &quot;The cost is the int64 base offset arithmetic; then removing int64 would be needed and contiguity changes would not help.&quot;, &quot;The cost is insufficient vector width (only 128 fp16 lanes per block), which would be addressed by processing several rows per program.&quot;], &quot;discriminating_observation&quot;: &quot;If the mechanism is per-lane address generation/scatter stores, a contiguous-affine rewrite should sharply reduce aiv_scalar_time and aiv_mte3_time per block and reduce task duration by a large factor while leaving aiv_vec_time roughly unchanged. If task duration stays near 70 ms with the same per-block time, the dominant mechanism is program count overhead instead.&quot;, &quot;author&quot;: &quot;agent&quot;, &quot;attribution_status&quot;: &quot;author_claim_not_causal_proof&quot;}}], &quot;label&quot;: &quot;V1&quot;, &quot;qualified&quot;: true, &quot;latency_ms&quot;: 1.2313744273139564, &quot;raw_geo_mean&quot;: 0.3158385729116616, &quot;raw_target_case_speedup&quot;: 0.1997187269108411, &quot;measurement_event_id&quot;: &quot;native-upsample-contrast-20261118/evidence/with-simulator/formal-ff8ebf5847e5/evaluation&quot;, &quot;replay&quot;: {&quot;result&quot;: &quot;native-upsample-contrast-20261118/evidence/with-simulator/formal-ff8ebf5847e5/evaluation/result.json&quot;, &quot;result_sha256&quot;: &quot;4a6b7b2d7650e2cc58535d9621e40579927124d2f840bf75ce9d7ffe02bbb736&quot;, &quot;num_passed&quot;: 24, &quot;num_workloads&quot;: 24}, &quot;geo_mean&quot;: 0.30799535918842086, &quot;conversion&quot;: {&quot;score&quot;: 0.30799535918842086, &quot;cases&quot;: [{&quot;case&quot;: &quot;upsample_bilinear2d-timing-0&quot;, &quot;cann_anchor_ms&quot;: 0.028750118001656107, &quot;historical_candidate_ms&quot;: 0.07965749058923678, &quot;ratio&quot;: 0.360921713563756}, {&quot;case&quot;: &quot;upsample_bilinear2d-timing-1&quot;, &quot;cann_anchor_ms&quot;: 0.24374234335018766, &quot;historical_candidate_ms&quot;: 1.2313744273139564, &quot;ratio&quot;: 0.1979433208482915}, {&quot;case&quot;: &quot;upsample_bilinear2d-timing-2&quot;, &quot;cann_anchor_ms&quot;: 0.047055930619879914, &quot;historical_candidate_ms&quot;: 0.07966308428798284, &quot;ratio&quot;: 0.5906867784552787}, {&quot;case&quot;: &quot;upsample_bilinear2d-timing-3&quot;, &quot;cann_anchor_ms&quot;: 0.3136162071551371, &quot;historical_candidate_ms&quot;: 1.2325022003914483, &quot;ratio&quot;: 0.25445488621077605}, {&quot;case&quot;: &quot;upsample_bilinear2d-timing-4&quot;, &quot;cann_anchor_ms&quot;: 0.025199706099427344, &quot;historical_candidate_ms&quot;: 0.07808080358779063, &quot;ratio&quot;: 0.32273881596382265}, {&quot;case&quot;: &quot;upsample_bilinear2d-timing-5&quot;, &quot;cann_anchor_ms&quot;: 0.29718808124292706, &quot;historical_candidate_ms&quot;: 1.2065337111524839, &quot;ratio&quot;: 0.2463156051885631}], &quot;formula&quot;: &quot;exp(mean(log(CANN_anchor_reference_ms / historical_candidate_ms)))&quot;, &quot;scope&quot;: &quot;共同CANN参考下的逐case实测耗时重算；原始配对成绩单列。&quot;}, &quot;cann_anchor&quot;: {&quot;kind&quot;: &quot;accepted IR evaluation per-case reference&quot;, &quot;cases&quot;: {&quot;upsample_bilinear2d-timing-0&quot;: 0.028750118001656107, &quot;upsample_bilinear2d-timing-1&quot;: 0.24374234335018766, &quot;upsample_bilinear2d-timing-2&quot;: 0.047055930619879914, &quot;upsample_bilinear2d-timing-3&quot;: 0.3136162071551371, &quot;upsample_bilinear2d-timing-4&quot;: 0.025199706099427344, &quot;upsample_bilinear2d-timing-5&quot;: 0.29718808124292706}}, &quot;score_is_rebased&quot;: true, &quot;axis_label&quot;: &quot;第1轮&quot;}</title>

<g><title>{&quot;display_round&quot;: 2, &quot;attempt&quot;: 6, &quot;score&quot;: 0.9138537510024922, &quot;target_case_speedup&quot;: 0.7882334326690397, &quot;source_sha256&quot;: &quot;6e7fed2de3d73b4174300829abb9f07e46b7f3372fb0904a6e79a1e52a7f32c3&quot;, &quot;parent_sha256&quot;: &quot;ff8ebf5847e5a78e43c79866847be7d00d71ebaecd75967d92214cd541f49d51&quot;, &quot;method&quot;: &quot;二维分块，扩大搬运&quot;, &quot;category&quot;: &quot;paired&quot;, &quot;decisions&quot;: [{&quot;path&quot;: &quot;with-simulator/trace/decisions/b5b6602648b6434fab7f381c10f78074.json&quot;, &quot;sha256&quot;: &quot;cbcdd064730befcb7a1f55dbe56f8856772d2b9e9c7b3744d07dcfb48010b819&quot;, &quot;record&quot;: {&quot;schema&quot;: &quot;hgkda.trace-decision/v1&quot;, &quot;id&quot;: &quot;b5b6602648b6434fab7f381c10f78074&quot;, &quot;recorded_at&quot;: &quot;2026-11-18T05:17:03.097910+00:00&quot;, &quot;round_id&quot;: &quot;round-06&quot;, &quot;input_source&quot;: {&quot;path&quot;: &quot;trace/sources/ff8ebf5847e5a78e43c79866847be7d00d71ebaecd75967d92214cd541f49d51.py&quot;, &quot;sha256&quot;: &quot;ff8ebf5847e5a78e43c79866847be7d00d71ebaecd75967d92214cd541f49d51&quot;}, &quot;evidence&quot;: [{&quot;reference&quot;: {&quot;path&quot;: &quot;trace/evidence/955447e70ca8eb445834eb7a08f3ffafcbc33add8af08f6864164408b235adf6.json&quot;, &quot;sha256&quot;: &quot;955447e70ca8eb445834eb7a08f3ffafcbc33add8af08f6864164408b235adf6&quot;}, &quot;original&quot;: {&quot;path&quot;: &quot;workspace/current-profiling.json&quot;, &quot;sha256&quot;: &quot;955447e70ca8eb445834eb7a08f3ffafcbc33add8af08f6864164408b235adf6&quot;}, &quot;category&quot;: &quot;paired_profiling&quot;, &quot;role&quot;: &quot;trigger&quot;, &quot;finding&quot;: &quot;current candidate upsample_bilinear2d_2x_kernel on timing-1: task duration 1205.6us with Block Dim 16384; per-block means aiv_time 2.97us, aiv_mte2_time 1.14us at aiv_mte2_active_bw 1.92 GB/s, aiv_mte3_time 0.26us at 3.70 GB/s, aiv_scalar_dual_time 0.28us. Coverage is the partial block window 16361..16383 (23 rows, profiling_coverage_limited), so these are per-block distribution means, not whole-task averages.&quot;, &quot;source_sha256&quot;: &quot;ff8ebf5847e5a78e43c79866847be7d00d71ebaecd75967d92214cd541f49d51&quot;}, {&quot;reference&quot;: {&quot;path&quot;: &quot;trace/evidence/9d88f668c36e61ce5da9f6759ede12d5a69a0ee3b938485f818adc70fd7c5cb0.json&quot;, &quot;sha256&quot;: &quot;9d88f668c36e61ce5da9f6759ede12d5a69a0ee3b938485f818adc70fd7c5cb0&quot;}, &quot;original&quot;: {&quot;path&quot;: &quot;workspace/simulator-evidence.json&quot;, &quot;sha256&quot;: &quot;9d88f668c36e61ce5da9f6759ede12d5a69a0ee3b938485f818adc70fd7c5cb0&quot;}, &quot;category&quot;: &quot;simulator&quot;, &quot;role&quot;: &quot;mechanism&quot;, &quot;finding&quot;: &quot;frontend capture on core0.veccore0 spans 28.4us over 8 consecutive program slots (idle gaps of ~3.56us each): MTE2 active 11.48us (40%, 254 events, productive 38.9%), MTE3 2.00us (7%), while ALL and FLOWCTRL lanes stay idle (&lt;=0.0013 active ratio) and the vector lane is small. So a program&#x27;s ~3.5us cadence is dominated by per-program setup plus its nine small GM-&gt;UB transfers, not by vector math.&quot;, &quot;source_sha256&quot;: &quot;ff8ebf5847e5a78e43c79866847be7d00d71ebaecd75967d92214cd541f49d51&quot;}, {&quot;reference&quot;: {&quot;path&quot;: &quot;trace/evidence/b788806c7d725d9fdcf9da6d9a788063faf7ab5c7134cb1ad649742a7d8e70ad.json&quot;, &quot;sha256&quot;: &quot;b788806c7d725d9fdcf9da6d9a788063faf7ab5c7134cb1ad649742a7d8e70ad&quot;}, &quot;original&quot;: {&quot;path&quot;: &quot;workspace/previous-result.json&quot;, &quot;sha256&quot;: &quot;b788806c7d725d9fdcf9da6d9a788063faf7ab5c7134cb1ad649742a7d8e70ad&quot;}, &quot;category&quot;: &quot;evaluation&quot;, &quot;role&quot;: &quot;trigger&quot;, &quot;finding&quot;: &quot;formal round-05 result: 24/24 pass, but timing-1 1.2314ms vs reference 0.2459ms (0.1997x) and timing-3/5 ~1.21-1.23ms, geo-mean 0.3158 below the 0.8 threshold; the five small cases sit at a ~78-80us floor.&quot;, &quot;source_sha256&quot;: &quot;ff8ebf5847e5a78e43c79866847be7d00d71ebaecd75967d92214cd541f49d51&quot;}, {&quot;reference&quot;: {&quot;path&quot;: &quot;trace/evidence/ff8ebf5847e5a78e43c79866847be7d00d71ebaecd75967d92214cd541f49d51.py&quot;, &quot;sha256&quot;: &quot;ff8ebf5847e5a78e43c79866847be7d00d71ebaecd75967d92214cd541f49d51&quot;}, &quot;original&quot;: {&quot;path&quot;: &quot;workspace/candidate.py&quot;, &quot;sha256&quot;: &quot;ff8ebf5847e5a78e43c79866847be7d00d71ebaecd75967d92214cd541f49d51&quot;}, &quot;category&quot;: &quot;source_ir&quot;, &quot;role&quot;: &quot;mechanism&quot;, &quot;finding&quot;: &quot;the exact-2x path launches grid (cdiv(IW,128), IH, N*C) = 16384 programs for timing-1; each program owns a single input row of 128 columns, issues 9 separately-masked row loads of 128 halfs and 2 interleaved 256-element stores, i.e. ~4 KB of traffic per program.&quot;, &quot;source_sha256&quot;: null}], &quot;hypothesis&quot;: &quot;For the exact-2x case the kernel is program-count bound rather than bandwidth or arithmetic bound: 16384 programs each move only ~4 KB, and the measured per-program cost is ~3.0-3.6us of which only ~1.4us is MTE2 and ~0.3us scalar/vector. Device time therefore scales with the number of programs and with the poor efficiency of 256-byte masked transfers. Letting one program own BLOCK_I input rows x BLOCK_J columns as 2-D tiles cuts the program count ~16x (16384 -&gt; 1024 for timing-1) and replaces 9 loads per row with 9 tile loads per 16 rows, so per-program transfer size grows by 16x while the number of per-program fixed costs drops.&quot;, &quot;change&quot;: &quot;Retile the exact-2x kernel over rows: one program handles BLOCK_I input rows x BLOCK_J input columns as 2-D tiles, grid = (cdiv(IW,BLOCK_J), cdiv(IH,BLOCK_I), N*C). The per-element arithmetic (0.25/0.75 blends, interleaved output columns, row/column edge replication) is kept bit-identical to the current kernel; only the memory organization and program count change. BLOCK_I is picked from call metadata as the largest of 16/8/4/2/1 that keeps at least ~192 programs, so the big timing cases drop to 1024 programs and the small cases to 256. The generic non-2x path, allocation, dispatch context and the run() signature are untouched.&quot;, &quot;expected&quot;: &quot;timing-1 device duration from 1205us toward &lt;=300us (program count 16384 -&gt; 1024, per-program transfer 4 KB -&gt; ~52 KB), timing-3/5 proportionally; small cases from ~78us toward ~25-35us (1024 -&gt; 256 programs). Per-block aiv_mte2_active_bw should rise well above 1.9 GB/s and Block Dim should read 1024 on timing-1. Correctness unchanged (same element-wise arithmetic); numerics identical per element.&quot;, &quot;validation&quot;: &quot;Preflight (static path review + compile check over the supplied cases) first; then the host&#x27;s full formal evaluation (24 cases) plus supplementary checks, and a fresh paired profiling / simulator capture for the new SHA to confirm the program count and the per-program MTE2 behavior. Compile failure or UB-capacity overflow would show up in preflight.&quot;, &quot;alternatives&quot;: [&quot;Per-lane masked loads are individually slow for an addressing reason, so enlarging tiles without removing masks would not help&quot;, &quot;Vector arithmetic / the tl.interleave lowering is the limiter (contradicted by the small vector fops and the nearly idle vector lane, but not fully excluded)&quot;, &quot;Host launch overhead dominates the full-call time (explains part of the 78us floor of the small cases, but cannot explain 1.23ms for timing-1 where the device task itself is 1205us)&quot;], &quot;discriminating_observation&quot;: &quot;Within the 28.4us single-core simulator window the inter-program cadence is ~3.56us for programs that only transfer ~2.3 KB, and MTE2 is the only materially active hardware lane (ALL/FLOWCTRL idle, small vector activity). A program-count/dispatch-bound explanation predicts total time roughly proportional to program count with per-program cost nearly independent of payload; a bandwidth- or arithmetic-bound explanation would predict the opposite scaling. Token-level: 16384 programs * ~2.97us / observed 1205us implies ~48 concurrently executing vector cores, consistent with one program at a time per core.&quot;, &quot;author&quot;: &quot;agent&quot;, &quot;attribution_status&quot;: &quot;author_claim_not_causal_proof&quot;}}], &quot;label&quot;: &quot;V2&quot;, &quot;qualified&quot;: true, &quot;latency_ms&quot;: 0.3092260912162162, &quot;raw_geo_mean&quot;: 0.9151141428433501, &quot;raw_target_case_speedup&quot;: 0.7895206258884438, &quot;measurement_event_id&quot;: &quot;native-upsample-contrast-20261118/evidence/with-simulator/formal-6e7fed2de3d7/evaluation&quot;, &quot;replay&quot;: {&quot;result&quot;: &quot;native-upsample-contrast-20261118/evidence/with-simulator/formal-6e7fed2de3d7/evaluation/result.json&quot;, &quot;result_sha256&quot;: &quot;9a3727806cb70a59b07943c8175089513422e5cdecd04341abae490a59f30045&quot;, &quot;num_passed&quot;: 24, &quot;num_workloads&quot;: 24}, &quot;geo_mean&quot;: 0.9138537510024922, &quot;conversion&quot;: {&quot;score&quot;: 0.9138537510024922, &quot;cases&quot;: [{&quot;case&quot;: &quot;upsample_bilinear2d-timing-0&quot;, &quot;cann_anchor_ms&quot;: 0.028750118001656107, &quot;historical_candidate_ms&quot;: 0.03696156941265868, &quot;ratio&quot;: 0.7778381291301366}, {&quot;case&quot;: &quot;upsample_bilinear2d-timing-1&quot;, &quot;cann_anchor_ms&quot;: 0.24374234335018766, &quot;historical_candidate_ms&quot;: 0.3092260912162162, &quot;ratio&quot;: 0.7882334326690397}, {&quot;case&quot;: &quot;upsample_bilinear2d-timing-2&quot;, &quot;cann_anchor_ms&quot;: 0.047055930619879914, &quot;historical_candidate_ms&quot;: 0.03683581235145369, &quot;ratio&quot;: 1.2774506008151847}, {&quot;case&quot;: &quot;upsample_bilinear2d-timing-3&quot;, &qu
